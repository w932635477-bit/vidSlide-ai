<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI调试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            margin: 0;
        }
        .debug-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .debug-section h3 {
            margin-top: 0;
            color: #007aff;
        }
        .test-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .test-btn:hover { background: #0056cc; }
        .test-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .file-input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 2px dashed #007aff;
            border-radius: 8px;
            background: #f8f9ff;
            cursor: pointer;
        }
        .file-input:hover {
            background: #e8f0ff;
        }
        .log-area {
            width: 100%;
            height: 200px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            background: #f8f9fa;
            margin-top: 10px;
        }
        .nav-test {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-item {
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: #f8f9fa;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-item:hover {
            background: #e9ecef;
        }
        .nav-item.active {
            background: #007aff;
            color: white;
            border-color: #0056cc;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔧 VidSlide AI UI调试工具</h1>
        <p>测试UI组件功能和事件绑定</p>

        <!-- 视频上传测试 -->
        <div class="debug-section">
            <h3>📤 视频上传测试</h3>
            <p>测试文件选择和上传功能</p>

            <div class="status info" id="upload-status">等待文件选择...</div>

            <input
                type="file"
                accept="video/*"
                class="file-input"
                id="debug-video-input"
                onchange="testFileUpload(event)"
            />

            <button class="test-btn" onclick="clearFileInput()">清除选择</button>
            <button class="test-btn" onclick="simulateVideoLoad()">模拟视频加载</button>
        </div>

        <!-- 左侧导航栏测试 -->
        <div class="debug-section">
            <h3>🧭 左侧导航栏测试</h3>
            <p>测试导航栏按钮响应</p>

            <div class="status info" id="nav-status">等待导航操作...</div>

            <div class="nav-test">
                <div class="nav-item" onclick="testNavClick('template-selector')">
                    🎨 模板选择器
                </div>
                <div class="nav-item" onclick="testNavClick('adjustment-panel')">
                    ⚙️ 参数调整面板
                </div>
                <div class="nav-item" onclick="testNavClick('asset-browser')">
                    🖼️ 素材浏览器
                </div>
                <div class="nav-item" onclick="testNavClick('animation-system')">
                    🎬 动画系统
                </div>
                <div class="nav-item" onclick="testNavClick('pip-controls')">
                    📺 画中画控制
                </div>
            </div>
        </div>

        <!-- 按钮功能测试 -->
        <div class="debug-section">
            <h3>🔘 按钮功能测试</h3>
            <p>测试主要操作按钮</p>

            <div class="status info" id="button-status">等待按钮操作...</div>

            <button class="test-btn" onclick="testButton('preview')">预览PPT</button>
            <button class="test-btn" onclick="testButton('export')">导出</button>
            <button class="test-btn" onclick="testButton('reset')">重置</button>
            <button class="test-btn" onclick="testButton('template-confirm')">确认模板</button>
        </div>

        <!-- 事件监听测试 -->
        <div class="debug-section">
            <h3>👂 事件监听测试</h3>
            <p>测试Vue组件事件通信</p>

            <div class="status info" id="event-status">等待事件触发...</div>

            <button class="test-btn" onclick="triggerVueEvent('template-selected', {id: 'test-template'})">
                触发模板选择事件
            </button>
            <button class="test-btn" onclick="triggerVueEvent('adjustment-changed', {size: 80})">
                触发调整变化事件
            </button>
            <button class="test-btn" onclick="triggerVueEvent('export-complete')">
                触发导出完成事件
            </button>
        </div>

        <!-- 控制台日志 -->
        <div class="debug-section">
            <h3>📋 调试日志</h3>
            <textarea id="debug-log" class="log-area" readonly></textarea>
            <button class="test-btn" onclick="clearLog()">清除日志</button>
        </div>
    </div>

    <script>
        // 调试日志函数
        function log(message, type = 'info') {
            const logArea = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            logArea.value += logMessage;
            logArea.scrollTop = logArea.scrollHeight;

            console.log(`[DEBUG-${type}] ${message}`);
        }

        // 初始化
        window.addEventListener('load', function() {
            log('UI调试页面已加载');
            log('开始测试UI组件功能');
        });

        // 文件上传测试
        function testFileUpload(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('upload-status');

            if (!file) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '未选择文件';
                log('文件上传测试: 未选择文件', 'error');
                return;
            }

            log(`文件上传测试: 选择了文件 "${file.name}" (${(file.size/1024/1024).toFixed(2)}MB)`);

            if (!file.type.startsWith('video/')) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `文件类型错误: ${file.type}`;
                log('文件上传测试: 文件类型不正确', 'error');
                return;
            }

            const maxSize = 500 * 1024 * 1024; // 500MB
            if (file.size > maxSize) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `文件过大: ${(file.size/1024/1024).toFixed(2)}MB > 500MB`;
                log('文件上传测试: 文件过大', 'error');
                return;
            }

            statusDiv.className = 'status success';
            statusDiv.textContent = `文件验证通过: ${file.name}`;
            log('文件上传测试: 文件验证通过', 'success');
        }

        function clearFileInput() {
            document.getElementById('debug-video-input').value = '';
            document.getElementById('upload-status').className = 'status info';
            document.getElementById('upload-status').textContent = '等待文件选择...';
            log('文件输入已清除');
        }

        function simulateVideoLoad() {
            const statusDiv = document.getElementById('upload-status');
            statusDiv.className = 'status info';
            statusDiv.textContent = '正在模拟视频加载...';

            setTimeout(() => {
                statusDiv.className = 'status success';
                statusDiv.textContent = '视频加载完成 (模拟)';
                log('模拟视频加载完成');
            }, 2000);
        }

        // 导航栏测试
        function testNavClick(navItem) {
            const statusDiv = document.getElementById('nav-status');
            const navItems = document.querySelectorAll('.nav-item');

            // 清除所有active状态
            navItems.forEach(item => item.classList.remove('active'));

            // 设置当前项为active
            event.target.classList.add('active');

            statusDiv.className = 'status success';
            statusDiv.textContent = `导航项 "${navItem}" 被点击`;

            log(`导航栏测试: 点击了 "${navItem}"`);
        }

        // 按钮功能测试
        function testButton(buttonName) {
            const statusDiv = document.getElementById('button-status');

            statusDiv.className = 'status info';
            statusDiv.textContent = `正在执行 "${buttonName}" 操作...`;

            log(`按钮测试: 点击了 "${buttonName}" 按钮`);

            // 模拟异步操作
            setTimeout(() => {
                const success = Math.random() > 0.3; // 70%成功率

                if (success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `"${buttonName}" 操作成功`;
                    log(`按钮测试: "${buttonName}" 操作成功`, 'success');
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `"${buttonName}" 操作失败`;
                    log(`按钮测试: "${buttonName}" 操作失败`, 'error');
                }
            }, 1000 + Math.random() * 2000);
        }

        // Vue事件测试
        function triggerVueEvent(eventName, data = null) {
            const statusDiv = document.getElementById('event-status');

            statusDiv.className = 'status info';
            statusDiv.textContent = `触发事件: ${eventName}`;

            const eventData = data ? ` (数据: ${JSON.stringify(data)})` : '';
            log(`事件测试: 触发了 "${eventName}"${eventData}`);

            // 模拟事件处理
            setTimeout(() => {
                statusDiv.className = 'status success';
                statusDiv.textContent = `事件 "${eventName}" 已处理`;
                log(`事件测试: "${eventName}" 事件处理完成`, 'success');
            }, 500);
        }

        // 清除日志
        function clearLog() {
            document.getElementById('debug-log').value = '';
            log('调试日志已清除');
        }

        // 全局错误处理
        window.addEventListener('error', function(e) {
            log(`JavaScript错误: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
        });

        // 未捕获的Promise错误
        window.addEventListener('unhandledrejection', function(e) {
            log(`未处理的Promise错误: ${e.reason}`, 'error');
        });
    </script>
</body>
</html>
