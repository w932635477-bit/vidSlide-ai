<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSlide AI - 工作流监控系统测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .main-area {
      flex: 1;
      padding: 40px;
      overflow: auto;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 16px;
      color: #86868b;
    }

    .upload-section {
      background: white;
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .upload-area {
      border: 2px dashed #d2d2d7;
      border-radius: 12px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-area:hover {
      border-color: #0071e3;
      background: #f5f5f7;
    }

    .upload-area.dragover {
      border-color: #0071e3;
      background: #e8f4ff;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .upload-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 14px;
      color: #86868b;
    }

    .action-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0071e3, #00a0ff);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.3);
    }

    .btn-primary:disabled {
      background: #d2d2d7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #e8e8ed;
    }

    .monitor-panel {
      width: 500px;
      height: 100vh;
      background: #1e1e1e;
      border-left: 1px solid #333;
      overflow: hidden;
    }

    .video-info {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 8px;
    }

    .video-info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .video-info-label {
      color: #86868b;
    }

    .video-info-value {
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-idle {
      background: #e8e8ed;
      color: #86868b;
    }

    .status-running {
      background: #e8f4ff;
      color: #0071e3;
    }

    .status-completed {
      background: #e8f5e9;
      color: #4caf50;
    }

    .status-error {
      background: #ffebee;
      color: #f44336;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 主工作区 -->
    <div class="main-area">
      <div class="header">
        <h1>🎬 VidSlide AI</h1>
        <p>工作流监控系统测试页面</p>
      </div>

      <!-- 上传区域 -->
      <div class="upload-section">
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📹</div>
          <div class="upload-text">点击或拖拽上传视频</div>
          <div class="upload-hint">支持 MP4, MOV, AVI 等格式</div>
        </div>
        <input type="file" id="fileInput" accept="video/*">

        <!-- 视频信息 -->
        <div class="video-info" id="videoInfo" style="display: none;">
          <div class="video-info-item">
            <span class="video-info-label">文件名:</span>
            <span class="video-info-value" id="fileName">-</span>
          </div>
          <div class="video-info-item">
            <span class="video-info-label">文件大小:</span>
            <span class="video-info-value" id="fileSize">-</span>
          </div>
          <div class="video-info-item">
            <span class="video-info-label">状态:</span>
            <span class="status-badge status-idle" id="status">就绪</span>
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="action-section">
        <button class="btn btn-primary" id="startBtn" disabled>
          ⚡ 一键自动生成
        </button>
        <button class="btn btn-secondary" id="pauseBtn" disabled>
          ⏸️ 暂停
        </button>
        <button class="btn btn-secondary" id="resumeBtn" disabled>
          ▶️ 继续
        </button>
        <button class="btn btn-secondary" id="cancelBtn" disabled>
          ⏹️ 取消
        </button>
      </div>
    </div>

    <!-- 监控面板 -->
    <div class="monitor-panel" id="monitorPanel">
      <div style="padding: 20px; color: #d4d4d4; text-align: center;">
        <p>📊 工作流监控台</p>
        <p style="margin-top: 8px; font-size: 12px; color: #86868b;">
          上传视频并点击"一键自动生成"开始
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    // 这是一个简化的测试页面
    // 实际使用时需要在 Vue 项目中集成

    let videoFile = null;

    // 上传区域
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const videoInfo = document.getElementById('videoInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const status = document.getElementById('status');

    // 按钮
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // 点击上传
    uploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        handleFileUpload(file);
      }
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('video/')) {
        handleFileUpload(file);
      }
    });

    // 处理文件上传
    function handleFileUpload(file) {
      videoFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatFileSize(file.size);
      videoInfo.style.display = 'block';
      startBtn.disabled = false;

      console.log('📹 视频上传:', file.name);
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // 开始生成
    startBtn.addEventListener('click', () => {
      if (!videoFile) return;

      console.log('🚀 开始一键自动生成...');

      // 更新状态
      status.textContent = '运行中';
      status.className = 'status-badge status-running';
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      cancelBtn.disabled = false;

      // 模拟工作流执行
      simulateWorkflow();
    });

    // 暂停
    pauseBtn.addEventListener('click', () => {
      console.log('⏸️ 暂停');
      pauseBtn.disabled = true;
      resumeBtn.disabled = false;
    });

    // 继续
    resumeBtn.addEventListener('click', () => {
      console.log('▶️ 继续');
      resumeBtn.disabled = true;
      pauseBtn.disabled = false;
    });

    // 取消
    cancelBtn.addEventListener('click', () => {
      console.log('⏹️ 取消');
      status.textContent = '已取消';
      status.className = 'status-badge status-idle';
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resumeBtn.disabled = true;
      cancelBtn.disabled = true;
    });

    // 模拟工作流执行
    function simulateWorkflow() {
      const steps = [
        '视频分析',
        '模板推荐',
        '素材匹配',
        '内容组合',
        '渲染导出'
      ];

      let currentStep = 0;

      const interval = setInterval(() => {
        if (currentStep < steps.length) {
          console.log(`▶️ 步骤 ${currentStep + 1}/${steps.length}: ${steps[currentStep]}`);
          currentStep++;
        } else {
          clearInterval(interval);
          console.log('✅ 工作流完成');
          status.textContent = '已完成';
          status.className = 'status-badge status-completed';
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          cancelBtn.disabled = true;
        }
      }, 2000);
    }

    console.log('📊 工作流监控系统测试页面已加载');
    console.log('提示: 这是一个简化的测试页面');
    console.log('完整功能请在 Vue 项目中使用 WorkspaceViewWithMonitor.vue');
  </script>
</body>
</html>
