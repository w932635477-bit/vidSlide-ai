<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地网络连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2em;
            background: linear-gradient(45deg, #2196F3, #9C27B0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1em;
        }
        .status-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #4CAF50;
        }
        .status-card.error {
            border-left-color: #f44336;
        }
        .status-card.warning {
            border-left-color: #ff9800;
        }
        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1.2em;
        }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
        .status-warning { background: #fff3e0; color: #ef6c00; }
        .status-info { background: #e3f2fd; color: #1565c0; }
        .status-title {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0;
        }
        .status-text {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        .btn {
            background: linear-gradient(45deg, #2196F3, #9C27B0);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌐 本地网络测试</div>
            <div class="subtitle">验证本地网络连接状态</div>
        </div>

        <div class="status-card" id="network-status">
            <div class="status-header">
                <div class="status-icon status-info">🔍</div>
                <div>
                    <h3 class="status-title">网络状态检查</h3>
                    <p class="status-text">正在检查本地网络...</p>
                </div>
            </div>
            <div class="result" id="network-result" style="display: none;"></div>
        </div>

        <div class="status-card" id="connectivity-status">
            <div class="status-header">
                <div class="status-icon status-info">🌍</div>
                <div>
                    <h3 class="status-title">连接测试</h3>
                    <p class="status-text">准备测试网络连接...</p>
                </div>
            </div>
            <div class="result" id="connectivity-result" style="display: none;"></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" onclick="checkNetworkStatus()">🔄 检查网络状态</button>
            <button class="btn" onclick="testConnectivity()">🌐 测试连接</button>
        </div>
    </div>

    <script>
        async function updateStatus(cardId, iconClass, title, text, result = null) {
            const card = document.getElementById(cardId);
            const icon = card.querySelector('.status-icon');
            const titleEl = card.querySelector('.status-title');
            const textEl = card.querySelector('.status-text');

            icon.className = `status-icon ${iconClass}`;
            titleEl.textContent = title;
            textEl.textContent = text;

            if (result) {
                showResult(cardId.replace('status', 'result'), result);
            }
        }

        function showResult(elementId, content) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.textContent = content;
        }

        async function checkNetworkStatus() {
            updateStatus('network-status', 'status-info', '网络状态检查', '正在检查网络配置...');

            const results = [];

            try {
                // 检查代理状态
                const response = await fetch('https://httpbin.org/ip');
                const data = await response.json();
                const ip = data.origin;

                results.push(`✅ 网络连接正常`);
                results.push(`📍 当前IP: ${ip}`);
                results.push(`🌐 DNS服务器: 正常`);

                updateStatus('network-status', 'status-success', '网络状态正常', '本地网络配置正确', results.join('\n'));

            } catch (error) {
                results.push(`❌ 网络连接失败: ${error.message}`);
                results.push(`💡 请检查网络连接或代理设置`);

                updateStatus('network-status', 'status-error', '网络连接异常', '无法访问互联网', results.join('\n'));
            }
        }

        async function testConnectivity() {
            updateStatus('connectivity-status', 'status-info', '连接测试', '正在测试网络连接...');

            const results = [];
            let successCount = 0;

            const testUrls = [
                { name: '百度', url: 'https://www.baidu.com' },
                { name: '腾讯', url: 'https://www.qq.com' },
                { name: 'GitHub', url: 'https://github.com' }
            ];

            for (const site of testUrls) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);

                    const response = await fetch(site.url, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);
                    results.push(`✅ ${site.name}: 可访问`);
                    successCount++;
                } catch (error) {
                    results.push(`❌ ${site.name}: 无法访问`);
                }
            }

            const statusClass = successCount > 0 ? 'status-success' : 'status-error';
            const statusTitle = successCount > 0 ? '连接测试完成' : '连接测试失败';
            const statusText = `成功访问 ${successCount}/${testUrls.length} 个网站`;

            updateStatus('connectivity-status', statusClass, statusTitle, statusText, results.join('\n'));
        }

        // 页面加载时自动检查
        window.onload = function() {
            setTimeout(checkNetworkStatus, 1000);
        };
    </script>
</body>
</html>
