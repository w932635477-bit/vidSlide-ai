<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process修复测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            margin: 0;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #007aff;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .test-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background 0.2s;
        }
        .test-btn:hover { background: #0056cc; }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Process修复测试</h1>
        <p>测试浏览器环境中process对象的访问修复</p>

        <!-- Process对象测试 -->
        <div class="test-section">
            <h3>🔍 Process对象测试</h3>
            <div class="status info" id="process-test">等待测试...</div>
            <button class="test-btn" onclick="testProcessObject()">测试Process对象</button>
            <button class="test-btn" onclick="testProcessEnvAccess()">测试环境变量访问</button>
        </div>

        <!-- API配置测试 -->
        <div class="test-section">
            <h3>🔧 API配置测试</h3>
            <div class="status info" id="api-test">等待测试...</div>
            <button class="test-btn" onclick="testAPIConfigImport()">测试API配置导入</button>
            <button class="test-btn" onclick="testAPIConfigUsage()">测试API配置使用</button>
        </div>

        <!-- 控制台输出 -->
        <div class="test-section">
            <h3>📋 测试日志</h3>
            <pre id="test-log">测试开始...\n</pre>
        </div>
    </div>

    <script type="module">
        // 测试日志函数
        function log(message) {
            const logElement = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        // 测试process对象
        window.testProcessObject = function() {
            const statusDiv = document.getElementById('process-test');

            try {
                log('测试process对象访问...');

                const processExists = typeof process !== 'undefined';
                log(`process对象存在: ${processExists}`);

                const processEnvExists = processExists && typeof process.env !== 'undefined';
                log(`process.env存在: ${processEnvExists}`);

                if (processExists && processEnvExists) {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Process对象意外存在（不应该在浏览器中）';
                    log('❌ 错误：process对象在浏览器环境中存在');
                } else {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Process对象检查通过（浏览器环境正常）';
                    log('✅ process对象检查通过');
                }

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Process对象测试失败: ${error.message}`;
                log(`❌ 错误: ${error.message}`);
            }
        };

        // 测试环境变量访问
        window.testProcessEnvAccess = function() {
            const statusDiv = document.getElementById('process-test');

            try {
                log('测试环境变量访问模式...');

                // 测试修复后的访问模式
                const safeAccess = (typeof process !== 'undefined' && process.env)
                    ? process.env.GOOGLE_SEARCH_API_KEY
                    : '';

                log(`安全访问结果: "${safeAccess}"`);

                // 测试多个环境变量
                const testVars = ['GOOGLE_SEARCH_API_KEY', 'BING_SEARCH_API_KEY', 'OPENAI_API_KEY'];
                let successCount = 0;

                testVars.forEach(varName => {
                    try {
                        const value = (typeof process !== 'undefined' && process.env)
                            ? process.env[varName]
                            : '';
                        log(`${varName}: "${value || 'undefined'}"`);
                        successCount++;
                    } catch (e) {
                        log(`❌ ${varName}访问失败: ${e.message}`);
                    }
                });

                if (successCount === testVars.length) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✅ 环境变量访问测试通过 (${successCount}/${testVars.length})`;
                    log('✅ 所有环境变量访问测试通过');
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `❌ 环境变量访问测试失败 (${successCount}/${testVars.length})`;
                    log(`❌ 部分环境变量访问失败: ${successCount}/${testVars.length}`);
                }

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 环境变量测试失败: ${error.message}`;
                log(`❌ 错误: ${error.message}`);
            }
        };

        // 测试API配置导入
        window.testAPIConfigImport = async function() {
            const statusDiv = document.getElementById('api-test');

            try {
                log('测试API配置导入...');
                statusDiv.className = 'status info';
                statusDiv.textContent = '正在导入API配置...';

                // 动态导入API配置
                const { GOOGLE_SEARCH_CONFIG, BING_SEARCH_CONFIG, OPENAI_CONFIG } = await import('./vidslide-ai/src/config/api-keys.js');

                log('✅ API配置导入成功');

                // 检查配置对象
                const configs = [
                    { name: 'Google Search', config: GOOGLE_SEARCH_CONFIG },
                    { name: 'Bing Search', config: BING_SEARCH_CONFIG },
                    { name: 'OpenAI', config: OPENAI_CONFIG }
                ];

                let successCount = 0;
                configs.forEach(({ name, config }) => {
                    if (config && typeof config === 'object') {
                        log(`✅ ${name}配置对象存在`);
                        successCount++;
                    } else {
                        log(`❌ ${name}配置对象不存在`);
                    }
                });

                if (successCount === configs.length) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✅ API配置导入测试通过 (${successCount}/${configs.length})`;
                    log('✅ 所有API配置导入测试通过');
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `❌ API配置导入测试失败 (${successCount}/${configs.length})`;
                    log(`❌ 部分API配置导入失败: ${successCount}/${configs.length}`);
                }

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ API配置导入失败: ${error.message}`;
                log(`❌ 导入错误: ${error.message}`);
            }
        };

        // 测试API配置使用
        window.testAPIConfigUsage = async function() {
            const statusDiv = document.getElementById('api-test');

            try {
                log('测试API配置使用...');
                statusDiv.className = 'status info';
                statusDiv.textContent = '正在测试API配置使用...';

                const { GOOGLE_SEARCH_CONFIG, getAPIConfig, isAPIConfigured } = await import('./vidslide-ai/src/config/api-keys.js');

                // 测试配置访问
                log(`Google Search API Key: "${GOOGLE_SEARCH_CONFIG.apiKey}"`);
                log(`Google Search CX: "${GOOGLE_SEARCH_CONFIG.cx}"`);
                log(`Base URL: "${GOOGLE_SEARCH_CONFIG.baseUrl}"`);

                // 测试getAPIConfig函数
                const googleConfig = getAPIConfig('googleSearch');
                if (googleConfig) {
                    log('✅ getAPIConfig函数工作正常');
                } else {
                    log('❌ getAPIConfig函数返回null');
                }

                // 测试isAPIConfigured函数
                const isGoogleConfigured = isAPIConfigured('googleSearch');
                log(`Google Search配置完整性: ${isGoogleConfigured}`);

                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ API配置使用测试通过';
                log('✅ API配置使用测试通过');

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ API配置使用失败: ${error.message}`;
                log(`❌ 使用错误: ${error.message}`);
            }
        };

        // 页面加载完成后的自动测试
        window.addEventListener('load', function() {
            log('页面加载完成，开始自动测试...');
            setTimeout(() => {
                testProcessObject();
            }, 1000);
        });
    </script>
</body>
</html>
