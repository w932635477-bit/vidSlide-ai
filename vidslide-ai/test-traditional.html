<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传统脚本测试</title>
</head>
<body>
    <h1>传统脚本测试</h1>
    <button onclick="testBasic()">基本测试</button>
    <button onclick="testFetch()">测试网络请求</button>
    <div id="log"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            console.log(message);
        }

        window.testBasic = function() {
            log('基本测试开始');
            log('window对象存在:', typeof window !== 'undefined');
            log('fetch函数存在:', typeof fetch !== 'undefined');
            log('localStorage存在:', typeof localStorage !== 'undefined');
            log('indexedDB存在:', typeof indexedDB !== 'undefined');
        };

        window.testFetch = async function() {
            log('测试网络请求...');
            try {
                const response = await fetch('https://httpbin.org/get');
                const data = await response.json();
                log('✅ 网络请求成功');
                log('响应状态:', response.status);
            } catch (error) {
                log('❌ 网络请求失败:', error.message);
            }
        };

        // 页面加载完成
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('当前URL:', window.location.href);
        });
    </script>
</body>
</html>
