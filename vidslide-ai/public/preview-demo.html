<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成预览演示 - VidSlide AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .generated-preview {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      overflow: hidden;
    }

    /* 预览头部 */
    .preview-header {
      padding: 12px 16px;
      background: #252526;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-left h3 {
      margin: 0;
      font-size: 16px;
      color: #fff;
      font-weight: 600;
    }

    .preview-type {
      padding: 4px 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      font-size: 12px;
      color: white;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      padding: 8px 16px;
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      border-radius: 6px;
      color: #d4d4d4;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: #3a3a3a;
      border-color: #4a4a4a;
      transform: translateY(-1px);
    }

    .header-btn.primary {
      background: linear-gradient(135deg, #4a9eff 0%, #4ec9b0 100%);
      border-color: transparent;
      color: white;
    }

    .header-btn.primary:hover {
      background: linear-gradient(135deg, #5aafff 0%, #5ed9c0 100%);
    }

    /* 预览内容 */
    .preview-content {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .video-preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
    }

    .preview-video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
    }

    /* PPT预览 */
    .ppt-preview {
      width: 320px;
      display: flex;
      flex-direction: column;
      background: #252526;
      border-radius: 8px;
      overflow: hidden;
    }

    .ppt-header {
      padding: 12px;
      border-bottom: 1px solid #3a3a3a;
    }

    .ppt-header h4 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #fff;
    }

    .ppt-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ppt-btn {
      padding: 6px 12px;
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      border-radius: 4px;
      color: #d4d4d4;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ppt-btn:hover:not(:disabled) {
      background: #3a3a3a;
    }

    .ppt-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .slide-counter {
      font-size: 12px;
      color: #8a8a8a;
    }

    .ppt-slides {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide-item {
      padding: 8px;
      border: 2px solid transparent;
      border-radius: 6px;
      background: #2a2a2a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .slide-item:hover {
      background: #3a3a3a;
    }

    .slide-item.active {
      border-color: #4a9eff;
      background: #3a3a3a;
    }

    .slide-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border-radius: 4px;
      font-size: 24px;
      color: #4a4a4a;
      margin-bottom: 6px;
    }

    .slide-title {
      font-size: 12px;
      color: #d4d4d4;
      text-align: center;
    }

    .current-slide {
      padding: 12px;
      border-top: 1px solid #3a3a3a;
      background: #1e1e1e;
    }

    .slide-placeholder-large {
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a2a;
      border-radius: 4px;
      font-size: 32px;
      color: #4a4a4a;
    }

    /* 生成信息 */
    .generation-info {
      padding: 12px 16px;
      background: #252526;
      border-top: 1px solid #3a3a3a;
      display: flex;
      gap: 24px;
      flex-shrink: 0;
    }

    .info-item {
      display: flex;
      gap: 8px;
      font-size: 13px;
    }

    .info-label {
      color: #8a8a8a;
    }

    .info-value {
      color: #d4d4d4;
      font-weight: 500;
    }

    /* 滚动条样式 */
    .ppt-slides::-webkit-scrollbar {
      width: 6px;
    }

    .ppt-slides::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    .ppt-slides::-webkit-scrollbar-thumb {
      background: #3e3e42;
      border-radius: 3px;
    }

    .ppt-slides::-webkit-scrollbar-thumb:hover {
      background: #4e4e52;
    }
  </style>
</head>
<body>
  <div class="generated-preview">
    <!-- 预览头部 -->
    <div class="preview-header">
      <div class="header-left">
        <h3>✨ 生成结果预览</h3>
        <span class="preview-type">PPT + 视频合成</span>
      </div>
      <div class="header-right">
        <button class="header-btn" onclick="alert('返回原视频')">
          <span>🔙</span>
          <span>返回原视频</span>
        </button>
        <button class="header-btn primary" onclick="alert('下载PPT')">
          <span>📥</span>
          <span>下载PPT</span>
        </button>
        <button class="header-btn primary" onclick="alert('导出视频')">
          <span>🎬</span>
          <span>导出视频</span>
        </button>
      </div>
    </div>

    <!-- 预览内容 -->
    <div class="preview-content">
      <!-- 视频预览 -->
      <div class="video-preview">
        <video class="preview-video" controls>
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
      </div>

      <!-- PPT幻灯片预览 -->
      <div class="ppt-preview">
        <div class="ppt-header">
          <h4>📊 PPT幻灯片 (5页)</h4>
          <div class="ppt-controls">
            <button class="ppt-btn" onclick="previousSlide()">◀ 上一页</button>
            <span class="slide-counter" id="slide-counter">1 / 5</span>
            <button class="ppt-btn" onclick="nextSlide()">下一页 ▶</button>
          </div>
        </div>

        <div class="ppt-slides" id="slides-container">
          <!-- 幻灯片将通过 JavaScript 生成 -->
        </div>

        <!-- 当前幻灯片大图 -->
        <div class="current-slide">
          <div class="slide-placeholder-large" id="current-slide-display">
            <span>幻灯片 1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 生成信息 -->
    <div class="generation-info">
      <div class="info-item">
        <span class="info-label">生成时间:</span>
        <span class="info-value">2026-01-18 12:30:45</span>
      </div>
      <div class="info-item">
        <span class="info-label">视频时长:</span>
        <span class="info-value">5:30</span>
      </div>
      <div class="info-item">
        <span class="info-label">PPT页数:</span>
        <span class="info-value">5页</span>
      </div>
      <div class="info-item">
        <span class="info-label">文件大小:</span>
        <span class="info-value">45.2 MB</span>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      { id: 1, title: '封面页 - VidSlide AI' },
      { id: 2, title: '项目概述' },
      { id: 3, title: '核心功能介绍' },
      { id: 4, title: '技术架构' },
      { id: 5, title: '总结与展望' }
    ]

    let currentSlide = 0

    function renderSlides() {
      const container = document.getElementById('slides-container')
      container.innerHTML = slides.map((slide, index) => `
        <div class="slide-item ${index === currentSlide ? 'active' : ''}" onclick="selectSlide(${index})">
          <div class="slide-placeholder">
            <span>${slide.id}</span>
          </div>
          <div class="slide-title">${slide.title}</div>
        </div>
      `).join('')
    }

    function updateCurrentSlide() {
      document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`
      document.getElementById('current-slide-display').innerHTML = `<span>幻灯片 ${currentSlide + 1}</span>`
      renderSlides()
    }

    function previousSlide() {
      if (currentSlide > 0) {
        currentSlide--
        updateCurrentSlide()
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++
        updateCurrentSlide()
      }
    }

    function selectSlide(index) {
      currentSlide = index
      updateCurrentSlide()
    }

    // 初始化
    renderSlides()
  </script>
</body>
</html>
