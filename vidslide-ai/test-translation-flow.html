<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译流程测试 - VidSlide AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .test-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .test-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .result {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            white-space: pre-wrap;
        }
        .error {
            background: rgba(255,0,0,0.1);
            border-left: 4px solid #ff4444;
        }
        .success {
            background: rgba(0,255,0,0.1);
            border-left: 4px solid #44ff44;
        }
    </style>
</head>
<body>
    <h1>🌐 VidSlide AI 翻译流程测试</h1>

    <div class="container">
        <h3>测试翻译和平台搜索</h3>
        <input type="text" id="testKeyword" class="test-input" placeholder="输入中文关键词，如：绿色能源" value="绿色能源">
        <br>
        <button class="test-btn" onclick="testTranslation()">测试翻译</button>
        <button class="test-btn" onclick="testFullFlow()">测试完整流程</button>
        <button class="test-btn" onclick="testPlatformSearch('unsplash')">测试Unsplash</button>
        <button class="test-btn" onclick="testPlatformSearch('pexels')">测试Pexels</button>
        <button class="test-btn" onclick="testPlatformSearch('pixabay')">测试Pixabay</button>
    </div>

    <div class="container">
        <h3>测试结果</h3>
        <div id="results"></div>
    </div>

    <script type="module">
        import TranslationService from './src/services/utils/IntelligentDispatcher/TranslationService.js'
        import materialService from './src/services/MaterialService.js'

        let translationService = new TranslationService()

        // 初始化服务
        async function initializeServices() {
            await translationService.initialize()
            await materialService.initialize()
            console.log('✅ 服务初始化完成')
        }

        // 添加结果
        function addResult(message, type = 'info') {
            const results = document.getElementById('results')
            const div = document.createElement('div')
            div.className = `result ${type}`
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`
            results.appendChild(div)
            results.scrollTop = results.scrollHeight
        }

        // 测试翻译
        window.testTranslation = async function() {
            const keyword = document.getElementById('testKeyword').value.trim()
            if (!keyword) {
                addResult('请输入关键词', 'error')
                return
            }

            addResult(`开始翻译: "${keyword}"`)

            try {
                const translated = await translationService.translate(keyword)
                addResult(`✅ 翻译成功: "${keyword}" → "${translated}"`, 'success')
            } catch (error) {
                addResult(`❌ 翻译失败: ${error.message}`, 'error')
            }
        }

        // 测试完整流程
        window.testFullFlow = async function() {
            const keyword = document.getElementById('testKeyword').value.trim()
            if (!keyword) {
                addResult('请输入关键词', 'error')
                return
            }

            addResult(`开始完整流程测试: "${keyword}"`)

            try {
                // 1. 搜索素材（会自动翻译）
                const results = await materialService.searchMaterials(keyword, {
                    limit: 3,
                    includeStats: true
                })

                if (results.success && results.materials.length > 0) {
                    addResult(`✅ 搜索成功: 找到 ${results.materials.length} 个素材`, 'success')
                    addResult(`素材来源: ${results.materials.map(m => m.source).join(', ')}`)
                    addResult(`搜索统计: ${JSON.stringify(results.searchStats, null, 2)}`)
                } else {
                    addResult(`❌ 搜索失败: ${results.error || '无可用素材'}`, 'error')
                }
            } catch (error) {
                addResult(`❌ 流程测试失败: ${error.message}`, 'error')
            }
        }

        // 测试特定平台
        window.testPlatformSearch = async function(platform) {
            const keyword = document.getElementById('testKeyword').value.trim()
            if (!keyword) {
                addResult('请输入关键词', 'error')
                return
            }

            addResult(`测试 ${platform} 平台搜索: "${keyword}"`)

            try {
                // 先翻译关键词
                const translated = await translationService.translate(keyword)
                addResult(`翻译: "${keyword}" → "${translated}"`)

                // 使用指定平台搜索
                const results = await materialService.searchMaterials(keyword, {
                    limit: 3,
                    forcePlatform: platform
                })

                if (results.success && results.materials.length > 0) {
                    addResult(`✅ ${platform} 搜索成功: ${results.materials.length} 个结果`, 'success')
                    addResult(`来源: ${results.materials[0].source}`)
                } else {
                    addResult(`❌ ${platform} 搜索失败: ${results.error || '无结果'}`, 'error')
                }
            } catch (error) {
                addResult(`❌ ${platform} 测试失败: ${error.message}`, 'error')
            }
        }

        // 清空结果
        window.clearResults = function() {
            document.getElementById('results').innerHTML = ''
        }

        // 显示统计
        window.showStats = async function() {
            try {
                const stats = await materialService.getServiceStats()
                addResult('📊 素材库统计:', 'info')
                addResult(JSON.stringify(stats, null, 2), 'info')
            } catch (error) {
                addResult(`❌ 获取统计失败: ${error.message}`, 'error')
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            initializeServices().catch(error => {
                addResult(`服务初始化失败: ${error.message}`, 'error')
            })
        })
    </script>
</body>
</html>
