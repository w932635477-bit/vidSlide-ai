<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路由测试</title>
</head>
<body>
  <div id="test-app">
    <h1>路由测试页面</h1>
    <div>
      <button onclick="testHome()">测试首页路由</button>
      <button onclick="testWorkspace()">测试工作空间路由</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    function testHome() {
      window.location.href = 'http://localhost:5173/';
    }

    function testWorkspace() {
      window.location.href = 'http://localhost:5173/workspace';
    }

    // 检查当前URL
    document.getElementById('result').innerHTML = `
      <p>当前URL: ${window.location.href}</p>
      <p>路径名: ${window.location.pathname}</p>
      <p>Hash: ${window.location.hash}</p>
    `;
  </script>
</body>
</html>
