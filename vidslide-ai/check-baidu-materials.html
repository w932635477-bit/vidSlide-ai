<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度素材检查工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { border-color: #28a745; background-color: #d4edda; }
        .warning { border-color: #ffc107; background-color: #fff3cd; }
        .error { border-color: #dc3545; background-color: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; max-height: 400px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #333; }
        .stat-label { color: #666; font-size: 14px; }
        .material-list { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; padding: 10px; margin: 10px 0; }
        .material-item { padding: 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .material-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <h1>🔍 百度素材检查工具</h1>
    <p>专门检查来自百度图片API下载的素材</p>

    <div>
        <button onclick="checkBaiduMaterials()">🔍 检查百度素材</button>
        <button onclick="checkAllMaterials()">📊 检查所有素材</button>
        <button onclick="clearBaiduMaterials()">🗑️ 删除百度素材</button>
        <button onclick="exportBaiduStats()">📊 导出百度统计</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="baiduCount">0</div>
            <div class="stat-label">百度素材数量</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="baiduSize">0 MB</div>
            <div class="stat-label">百度素材大小</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="baiduPercentage">0%</div>
            <div class="stat-label">百度素材占比</div>
        </div>
    </div>

    <div class="result" id="result">
        <strong>状态：</strong>等待检查...
    </div>

    <div class="result success" id="baiduMaterials" style="display: none;">
        <strong>百度素材列表：</strong>
        <div class="material-list" id="baiduList"></div>
    </div>

    <div class="result info" id="details" style="display: none;">
        <strong>详细统计：</strong>
        <pre id="detailsContent"></pre>
    </div>

    <!-- 加载必要的脚本 -->
    <script type="module">
        import LocalMaterialLibrary from './src/services/LocalMaterialLibrary.js';

        let library = null;

        async function initialize() {
            if (!library) {
                library = LocalMaterialLibrary;
                await library.initialize();
                log('✅ 本地素材库初始化完成');
            }
            return library;
        }

        window.checkBaiduMaterials = async function() {
            try {
                log('🔍 正在检查百度素材...');
                const lib = await initialize();

                // 获取所有素材
                const allMaterials = await getAllMaterials();

                // 过滤百度素材
                const baiduMaterials = allMaterials.filter(m => m.source === 'baidu');

                // 统计信息
                const baiduSize = baiduMaterials.reduce((total, m) => total + (m.size || 0), 0);
                const totalSize = allMaterials.reduce((total, m) => total + (m.size || 0), 0);
                const percentage = totalSize > 0 ? ((baiduSize / totalSize) * 100).toFixed(1) : 0;

                // 更新UI
                document.getElementById('baiduCount').textContent = baiduMaterials.length;
                document.getElementById('baiduSize').textContent = formatBytes(baiduSize);
                document.getElementById('baiduPercentage').textContent = percentage + '%';

                // 显示百度素材列表
                displayBaiduMaterials(baiduMaterials);

                // 显示详细统计
                const details = {
                    summary: {
                        totalBaiduMaterials: baiduMaterials.length,
                        baiduSize: baiduSize,
                        baiduPercentage: percentage + '%',
                        totalMaterials: allMaterials.length,
                        totalSize: totalSize
                    },
                    baiduMaterials: baiduMaterials.map(m => ({
                        id: m.id,
                        title: m.title,
                        url: m.url || m.dataUrl,
                        size: m.size || 0,
                        cachedAt: m.cachedAt || '未知'
                    }))
                };

                document.getElementById('detailsContent').textContent = JSON.stringify(details, null, 2);
                document.getElementById('details').style.display = 'block';

                log(`✅ 检查完成！找到 ${baiduMaterials.length} 个百度素材`);

                if (baiduMaterials.length === 0) {
                    log('⚠️ 未找到任何百度素材！可能的原因：');
                    log('  - 从未使用百度API下载过素材');
                    log('  - 百度素材存储失败');
                    log('  - 素材已被清理');
                }

            } catch (error) {
                log('❌ 检查失败: ' + error.message);
                console.error(error);
            }
        };

        window.checkAllMaterials = async function() {
            try {
                log('📊 正在检查所有素材...');
                const lib = await initialize();
                const allMaterials = await getAllMaterials();

                const stats = await lib.getStatistics();

                log(`📊 总素材数: ${allMaterials.length}`);
                log(`📊 缓存大小: ${formatBytes(stats.cacheSize || 0)}`);

                // 按来源统计
                const bySource = {};
                allMaterials.forEach(m => {
                    const source = m.source || 'unknown';
                    bySource[source] = (bySource[source] || 0) + 1;
                });

                log('📊 按来源分布:');
                Object.entries(bySource).forEach(([source, count]) => {
                    log(`  - ${source}: ${count} 个`);
                });

            } catch (error) {
                log('❌ 检查失败: ' + error.message);
                console.error(error);
            }
        };

        window.clearBaiduMaterials = async function() {
            if (!confirm('确定要删除所有百度素材吗？此操作不可恢复！')) {
                return;
            }

            try {
                log('🗑️ 正在删除百度素材...');

                // 这里需要实现删除特定来源素材的逻辑
                // 由于LocalMaterialLibrary没有直接的方法，我们需要手动清理

                alert('删除功能需要后端支持。目前请使用"清空所有数据"功能。');

            } catch (error) {
                log('❌ 删除失败: ' + error.message);
                console.error(error);
            }
        };

        window.exportBaiduStats = async function() {
            try {
                log('📊 正在导出百度统计...');

                const lib = await initialize();
                const allMaterials = await getAllMaterials();
                const baiduMaterials = allMaterials.filter(m => m.source === 'baidu');

                const exportData = {
                    timestamp: new Date().toISOString(),
                    summary: {
                        totalBaiduMaterials: baiduMaterials.length,
                        totalMaterials: allMaterials.length,
                        baiduPercentage: allMaterials.length > 0 ? ((baiduMaterials.length / allMaterials.length) * 100).toFixed(1) + '%' : '0%'
                    },
                    baiduMaterials: baiduMaterials.map(m => ({
                        id: m.id,
                        title: m.title,
                        source: m.source,
                        url: m.url || m.dataUrl,
                        size: m.size || 0,
                        cachedAt: m.cachedAt || '未知'
                    }))
                };

                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `baidu-materials-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);

                log('✅ 百度统计已导出');

            } catch (error) {
                log('❌ 导出失败: ' + error.message);
                console.error(error);
            }
        };

        async function getAllMaterials() {
            // 使用searchMaterials方法获取所有素材
            const results = await library.searchMaterials('', { limit: 10000 });
            return results.cached || [];
        }

        function displayBaiduMaterials(materials) {
            const listDiv = document.getElementById('baiduList');

            if (materials.length === 0) {
                listDiv.innerHTML = '<p>未找到百度素材</p>';
            } else {
                listDiv.innerHTML = materials.map(m => `
                    <div class="material-item">
                        <div>
                            <strong>${m.title || m.id}</strong><br>
                            <small>URL: ${m.url || m.dataUrl || '无'}</small>
                        </div>
                        <div>
                            <small>${formatBytes(m.size || 0)}</small><br>
                            <small>${m.cachedAt || '未知时间'}</small>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('baiduMaterials').style.display = materials.length > 0 ? 'block' : 'none';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function log(message) {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            resultDiv.innerHTML = `<strong>状态：</strong>[${timestamp}] ${message}`;
            console.log(message);
        }

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            log('百度素材检查工具已就绪');
        });
    </script>
</body>
</html>
