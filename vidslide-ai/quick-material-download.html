<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速素材下载器 - VidSlide AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }
        .stat-label {
            color: #6c757d;
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #bd2130;
        }
        .log-area {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
        }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-error { color: #dc3545; }
        .log-info { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 快速素材下载器</h1>
            <p>直接使用英文关键词，快速搭建800张素材库</p>
        </div>

        <div class="status">
            <h3>📊 下载状态</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="downloadedCount">0</div>
                    <div class="stat-label">已下载</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="targetCount">800</div>
                    <div class="stat-label">目标数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="processedKeywords">0</div>
                    <div class="stat-label">处理关键词</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalKeywords">120</div>
                    <div class="stat-label">总关键词</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="startDownload()">
                ▶️ 开始下载
            </button>
            <button class="btn-success" id="statusBtn" onclick="checkStatus()">
                📊 查看状态
            </button>
            <button class="btn-danger" id="clearBtn" onclick="clearMaterials()">
                🗑️ 清空素材
            </button>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-entry log-info">🎯 系统已就绪，点击"开始下载"启动快速下载</div>
        </div>
    </div>

    <script type="module">
        import downloader from './scripts/quick-material-downloader.js';

        let isDownloading = false;

        // 页面加载完成后的初始化
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                addLog('🚀 初始化下载器...', 'info');

                // 等待一小段时间确保模块完全加载
                await new Promise(resolve => setTimeout(resolve, 500));

                if (window.quickDownloader) {
                    const success = await window.quickDownloader.initialize();
                    if (success) {
                        addLog('✅ 初始化完成', 'success');
                        updateStatus();
                    } else {
                        addLog('❌ 初始化失败', 'error');
                    }
                } else {
                    addLog('❌ 下载器模块加载失败', 'error');
                }
            } catch (error) {
                addLog('❌ 初始化出错: ' + error.message, 'error');
            }
        });

        // 开始下载
        window.startDownload = async function() {
            if (isDownloading) {
                addLog('⚠️ 下载已在进行中', 'warning');
                return;
            }

            try {
                isDownloading = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').textContent = '⏳ 下载中...';

                addLog('🎯 开始快速下载800张素材...', 'info');

                // 等待下载器初始化完成
                if (!window.quickDownloader) {
                    addLog('⏳ 等待下载器初始化...', 'info');
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                if (window.quickDownloader) {
                    // 开始下载
                    await window.quickDownloader.downloadMaterials();
                    addLog('🎉 下载完成！', 'success');
                } else {
                    throw new Error('下载器初始化失败');
                }

            } catch (error) {
                addLog('❌ 下载失败: ' + error.message, 'error');
            } finally {
                isDownloading = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('startBtn').textContent = '▶️ 开始下载';
                updateStatus();
            }
        };

        // 检查状态
        window.checkStatus = async function() {
            try {
                if (window.quickDownloader) {
                    const status = await window.quickDownloader.getStatus();
                    addLog(`📊 状态检查: ${status.downloadedCount}/${status.targetCount} 张素材`, 'info');
                    addLog(`📋 已处理: ${status.processedKeywords}/${status.totalKeywords} 个关键词`, 'info');
                } else {
                    addLog('⚠️ 下载器未初始化', 'warning');
                }
                updateStatus();
            } catch (error) {
                addLog('❌ 状态检查失败: ' + error.message, 'error');
            }
        };

        // 清空素材
        window.clearMaterials = async function() {
            if (!confirm('确定要清空所有素材吗？此操作不可恢复！')) {
                return;
            }

            try {
                if (window.quickDownloader) {
                    addLog('🗑️ 清空素材库...', 'warning');
                    await window.quickDownloader.library.clearAllMaterials();
                    addLog('✅ 素材库已清空', 'success');
                } else {
                    addLog('⚠️ 下载器未初始化', 'warning');
                }
                updateStatus();
            } catch (error) {
                addLog('❌ 清空失败: ' + error.message, 'error');
            }
        };

        // 更新状态显示
        async function updateStatus() {
            try {
                if (window.quickDownloader) {
                    const status = await window.quickDownloader.getStatus();
                    document.getElementById('downloadedCount').textContent = status.downloadedCount;
                    document.getElementById('processedKeywords').textContent = status.processedKeywords;

                    // 更新进度条
                    const progress = (status.downloadedCount / status.targetCount) * 100;
                    document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';
                }
            } catch (error) {
                console.warn('状态更新失败:', error);
            }
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;

            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;

            console.log(message);
        }

        // 定期更新状态
        setInterval(() => {
            if (!isDownloading) {
                updateStatus();
            }
        }, 5000);
    </script>
</body>
</html>
