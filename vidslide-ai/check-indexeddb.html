<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查IndexedDB缓存</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🎯 检查IndexedDB缓存状态</h1>

    <div>
        <button onclick="checkIndexedDB()">检查IndexedDB</button>
        <button onclick="clearIndexedDB()">清空IndexedDB</button>
    </div>

    <div id="results"></div>

    <script>
        async function checkIndexedDB() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result info">正在检查IndexedDB...</div>';

            try {
                // 检查是否支持IndexedDB
                if (!window.indexedDB) {
                    throw new Error('浏览器不支持IndexedDB');
                }

                const databases = await indexedDB.databases();
                console.log('所有数据库:', databases);

                // 查找VidSlideAI相关的数据库
                const vidSlideDB = databases.find(db => db.name && db.name.includes('VidSlideAI'));

                if (!vidSlideDB) {
                    resultsDiv.innerHTML += '<div class="result error">❌ 未找到VidSlideAI数据库</div>';
                    return;
                }

                resultsDiv.innerHTML += `<div class="result success">✅ 找到数据库: ${vidSlideDB.name}</div>`;

                // 打开数据库
                const db = await openDB(vidSlideDB.name, vidSlideDB.version);
                resultsDiv.innerHTML += '<div class="result info">✅ 数据库已打开</div>';

                // 获取所有对象存储
                const stores = Array.from(db.objectStoreNames);
                resultsDiv.innerHTML += `<div class="result info">📂 对象存储: ${stores.join(', ')}</div>`;

                // 检查每个存储中的数据
                for (const storeName of stores) {
                    try {
                        const count = await getStoreCount(db, storeName);
                        resultsDiv.innerHTML += `<div class="result success">📊 ${storeName}: ${count} 条记录</div>`;

                        // 如果有数据，显示一些样本
                        if (count > 0 && count < 10) {
                            const samples = await getStoreSamples(db, storeName, 3);
                            resultsDiv.innerHTML += `<div class="result info">📋 ${storeName} 样本数据:<br><pre>${JSON.stringify(samples, null, 2)}</pre></div>`;
                        }
                    } catch (error) {
                        resultsDiv.innerHTML += `<div class="result error">❌ 检查 ${storeName} 失败: ${error.message}</div>`;
                    }
                }

                db.close();

            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">❌ 检查失败: ${error.message}</div>`;
                console.error('IndexedDB检查错误:', error);
            }
        }

        async function clearIndexedDB() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result info">正在清空IndexedDB...</div>';

            try {
                const databases = await indexedDB.databases();

                for (const dbInfo of databases) {
                    if (dbInfo.name && dbInfo.name.includes('VidSlideAI')) {
                        const deleteRequest = indexedDB.deleteDatabase(dbInfo.name);

                        await new Promise((resolve, reject) => {
                            deleteRequest.onsuccess = () => resolve();
                            deleteRequest.onerror = () => reject(deleteRequest.error);
                            deleteRequest.onblocked = () => reject(new Error('数据库删除被阻止'));
                        });

                        resultsDiv.innerHTML += `<div class="result success">✅ 已删除数据库: ${dbInfo.name}</div>`;
                    }
                }

                resultsDiv.innerHTML += '<div class="result success">🎉 IndexedDB已清空</div>';

            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">❌ 清空失败: ${error.message}</div>`;
            }
        }

        function openDB(name, version) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(name, version);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
                request.onupgradeneeded = () => {
                    // 如果版本不匹配，使用最新版本重试
                    const db = request.result;
                    db.close();
                    openDB(name).then(resolve).catch(reject);
                };
            });
        }

        function getStoreCount(db, storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const countRequest = store.count();

                countRequest.onsuccess = () => resolve(countRequest.result);
                countRequest.onerror = () => reject(countRequest.error);
            });
        }

        function getStoreSamples(db, storeName, limit = 3) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.openCursor();
                const samples = [];

                request.onsuccess = (event) => {
                    const cursor = event.target.result;
                    if (cursor && samples.length < limit) {
                        // 只保留关键信息
                        const value = cursor.value;
                        const sample = {
                            id: value.id,
                            category: value.category,
                            source: value.source,
                            name: value.name ? value.name.substring(0, 50) : 'N/A'
                        };
                        samples.push(sample);
                        cursor.continue();
                    } else {
                        resolve(samples);
                    }
                };

                request.onerror = () => reject(request.error);
            });
        }

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkIndexedDB();
            }, 1000);
        });
    </script>
</body>
</html>
