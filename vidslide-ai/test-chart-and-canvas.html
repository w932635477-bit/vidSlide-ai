<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图表需求和画布功能测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .test-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .test-section h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.success {
      background: rgba(52, 199, 89, 0.2);
      color: #34c759;
    }

    .status-badge.error {
      background: rgba(255, 59, 48, 0.2);
      color: #ff3b30;
    }

    .status-badge.pending {
      background: rgba(255, 149, 0, 0.2);
      color: #ff9500;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .test-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 20px;
    }

    .test-card h3 {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .test-card p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #34c759 0%, #30d158 100%);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4);
    }

    .result-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      max-height: 300px;
      overflow-y: auto;
    }

    .result-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 3px solid #667eea;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-item .title {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 4px;
    }

    .result-item .meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .log-box {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 16px;
    }

    .log-entry {
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.7);
    }

    .log-entry.success {
      color: #34c759;
    }

    .log-entry.error {
      color: #ff3b30;
    }

    .log-entry.info {
      color: #007aff;
    }

    .canvas-preview {
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-top: 16px;
      min-height: 200px;
    }

    .canvas-item {
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .canvas-item .icon {
      font-size: 24px;
    }

    .canvas-item .info {
      flex: 1;
    }

    .canvas-item .info .title {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 4px;
    }

    .canvas-item .info .type {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .btn-remove {
      padding: 6px 12px;
      background: rgba(255, 59, 48, 0.2);
      color: #ff3b30;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background: rgba(255, 59, 48, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 4px;
    }

    .stat-card .label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 图表需求和画布功能测试</h1>

    <!-- 测试1: 图表需求功能 -->
    <div class="test-section">
      <h2>
        <span>测试1: 图表需求功能</span>
        <span class="status-badge pending" id="chart-status">待测试</span>
      </h2>

      <div class="test-grid">
        <div class="test-card">
          <h3>📈 图表关键词搜索</h3>
          <p>测试包含 "chart"、"diagram"、"graph" 等关键词的素材搜索</p>
          <button class="btn btn-primary" onclick="testChartSearch()">开始测试</button>
          <div id="chart-results" class="result-box" style="display: none;"></div>
        </div>

        <div class="test-card">
          <h3>📊 图表类型识别</h3>
          <p>验证图表类型的正确识别和分类</p>
          <button class="btn btn-primary" onclick="testChartTypeInference()">开始测试</button>
          <div id="type-results" class="result-box" style="display: none;"></div>
        </div>

        <div class="test-card">
          <h3>🎯 图表素材筛选</h3>
          <p>测试按图表类型筛选素材的功能</p>
          <button class="btn btn-primary" onclick="testChartFilter()">开始测试</button>
          <div id="filter-results" class="result-box" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- 测试2: 添加到画布功能 -->
    <div class="test-section">
      <h2>
        <span>测试2: 添加到画布功能</span>
        <span class="status-badge pending" id="canvas-status">待测试</span>
      </h2>

      <div class="test-grid">
        <div class="test-card">
          <h3>➕ 添加素材到画布</h3>
          <p>测试将素材需求添加到画布的功能</p>
          <button class="btn btn-success" onclick="testAddToCanvas()">添加测试素材</button>
          <button class="btn btn-primary" onclick="clearCanvas()" style="margin-top: 8px;">清空画布</button>
        </div>

        <div class="test-card" style="grid-column: span 2;">
          <h3>🎨 画布预览</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="value" id="canvas-count">0</div>
              <div class="label">画布素材数</div>
            </div>
            <div class="stat-card">
              <div class="value" id="image-count">0</div>
              <div class="label">图片素材</div>
            </div>
            <div class="stat-card">
              <div class="value" id="chart-count">0</div>
              <div class="label">图表素材</div>
            </div>
            <div class="stat-card">
              <div class="value" id="other-count">0</div>
              <div class="label">其他素材</div>
            </div>
          </div>
          <div class="canvas-preview" id="canvas-preview">
            <p style="text-align: center; color: rgba(255, 255, 255, 0.4);">画布为空，点击"添加测试素材"开始测试</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 测试日志 -->
    <div class="test-section">
      <h2>📋 测试日志</h2>
      <div class="log-box" id="log-box">
        <div class="log-entry info">[等待测试] 点击上方按钮开始测试...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import materialService from './src/services/MaterialService.js'
    import intelligentDispatcher from './src/services/IntelligentDispatcher.js'

    // 全局变量
    window.materialService = materialService
    window.dispatcher = intelligentDispatcher
    window.canvasItems = []

    // 初始化服务
    async function initServices() {
      try {
        log('初始化 MaterialService...', 'info')
        await window.materialService.initialize()
        log('✓ MaterialService 初始化成功', 'success')

        log('初始化 IntelligentDispatcher...', 'info')
        await window.dispatcher.initialize()
        log('✓ IntelligentDispatcher 初始化成功', 'success')
      } catch (error) {
        log(`✗ 初始化失败: ${error.message}`, 'error')
        console.error(error)
      }
    }

    // 日志函数
    function log(message, type = 'info') {
      const logBox = document.getElementById('log-box')
      const timestamp = new Date().toLocaleTimeString()
      const entry = document.createElement('div')
      entry.className = `log-entry ${type}`
      entry.textContent = `[${timestamp}] ${message}`
      logBox.appendChild(entry)
      logBox.scrollTop = logBox.scrollHeight
    }

    // 测试1: 图表关键词搜索
    window.testChartSearch = async function() {
      log('开始测试图表关键词搜索...', 'info')
      const resultsDiv = document.getElementById('chart-results')
      resultsDiv.style.display = 'block'
      resultsDiv.innerHTML = '<p style="color: rgba(255,255,255,0.5);">搜索中...</p>'

      const chartKeywords = ['chart', 'diagram', 'graph', 'data visualization', 'infographic']
      let successCount = 0
      let totalResults = 0

      for (const keyword of chartKeywords) {
        try {
          log(`搜索关键词: "${keyword}"`, 'info')
          const results = await window.materialService.searchMaterials(keyword, { limit: 5 })

          if (results && results.length > 0) {
            successCount++
            totalResults += results.length
            log(`✓ "${keyword}" 找到 ${results.length} 个结果`, 'success')
          } else {
            log(`⚠ "${keyword}" 未找到结果`, 'error')
          }
        } catch (error) {
          log(`✗ "${keyword}" 搜索失败: ${error.message}`, 'error')
        }
      }

      // 显示结果
      resultsDiv.innerHTML = `
        <div class="result-item">
          <div class="title">测试完成</div>
          <div class="meta">成功: ${successCount}/${chartKeywords.length} | 总结果: ${totalResults}</div>
        </div>
      `

      // 更新状态
      const status = document.getElementById('chart-status')
      if (successCount === chartKeywords.length) {
        status.className = 'status-badge success'
        status.textContent = '✓ 通过'
        log('✓ 图表关键词搜索测试通过', 'success')
      } else {
        status.className = 'status-badge error'
        status.textContent = '✗ 失败'
        log('✗ 图表关键词搜索测试失败', 'error')
      }
    }

    // 测试2: 图表类型识别
    window.testChartTypeInference = function() {
      log('开始测试图表类型识别...', 'info')
      const resultsDiv = document.getElementById('type-results')
      resultsDiv.style.display = 'block'
      resultsDiv.innerHTML = ''

      const testCases = [
        { keyword: 'sales chart', expectedType: 'chart' },
        { keyword: 'flow diagram', expectedType: 'diagram' },
        { keyword: 'data graph', expectedType: 'chart' },
        { keyword: 'business infographic', expectedType: 'image' },
        { keyword: 'pie chart', expectedType: 'chart' }
      ]

      let passCount = 0

      testCases.forEach(({ keyword, expectedType }) => {
        const inferredType = inferMaterialType(keyword)
        const passed = inferredType === expectedType

        if (passed) {
          passCount++
          log(`✓ "${keyword}" → ${inferredType} (预期: ${expectedType})`, 'success')
        } else {
          log(`✗ "${keyword}" → ${inferredType} (预期: ${expectedType})`, 'error')
        }

        resultsDiv.innerHTML += `
          <div class="result-item">
            <div class="title">${keyword}</div>
            <div class="meta">识别: ${inferredType} | 预期: ${expectedType} | ${passed ? '✓' : '✗'}</div>
          </div>
        `
      })

      log(`类型识别测试完成: ${passCount}/${testCases.length} 通过`, passCount === testCases.length ? 'success' : 'error')
    }

    // 类型推断函数（从组件复制）
    function inferMaterialType(keyword) {
      const lowerKeyword = keyword.toLowerCase()

      const typeMappings = {
        'chart': 'chart',
        'diagram': 'diagram',
        'graph': 'chart',
        'infographic': 'illustration',
        'graphic': 'illustration',
        'image': 'image',
        'photo': 'image',
        'picture': 'image',
        'illustration': 'illustration',
        'icon': 'icon',
        'background': 'background',
        'video': 'video',
        'animation': 'animation',
        'motion': 'animation'
      }

      for (const [key, type] of Object.entries(typeMappings)) {
        if (lowerKeyword.includes(key)) {
          return type
        }
      }

      return 'image'
    }

    // 测试3: 图表素材筛选
    window.testChartFilter = function() {
      log('开始测试图表素材筛选...', 'info')
      const resultsDiv = document.getElementById('filter-results')
      resultsDiv.style.display = 'block'

      // 模拟素材列表
      const mockMaterials = [
        { id: 1, title: 'Sales Chart', type: 'chart' },
        { id: 2, title: 'Business Photo', type: 'image' },
        { id: 3, title: 'Flow Diagram', type: 'diagram' },
        { id: 4, title: 'Company Logo', type: 'icon' },
        { id: 5, title: 'Data Graph', type: 'chart' }
      ]

      // 筛选图表类型
      const chartMaterials = mockMaterials.filter(m => m.type === 'chart' || m.type === 'diagram')

      resultsDiv.innerHTML = ''
      chartMaterials.forEach(material => {
        resultsDiv.innerHTML += `
          <div class="result-item">
            <div class="title">${material.title}</div>
            <div class="meta">类型: ${material.type}</div>
          </div>
        `
      })

      log(`✓ 筛选完成: 找到 ${chartMaterials.length} 个图表素材`, 'success')
    }

    // 测试4: 添加到画布
    window.testAddToCanvas = function() {
      log('添加测试素材到画布...', 'info')

      const testMaterials = [
        { id: 'mat-1', title: '销售数据图表', type: 'chart', icon: '📈' },
        { id: 'mat-2', title: '业务流程图', type: 'diagram', icon: '📊' },
        { id: 'mat-3', title: '产品展示图', type: 'image', icon: '🖼️' },
        { id: 'mat-4', title: '公司Logo', type: 'icon', icon: '🔘' }
      ]

      testMaterials.forEach(material => {
        addToCanvas(material)
      })

      const status = document.getElementById('canvas-status')
      status.className = 'status-badge success'
      status.textContent = '✓ 通过'
      log('✓ 素材已添加到画布', 'success')
    }

    // 添加到画布函数
    function addToCanvas(material) {
      // 检查是否已存在
      if (window.canvasItems.find(item => item.id === material.id)) {
        log(`⚠ 素材 "${material.title}" 已在画布中`, 'error')
        return
      }

      window.canvasItems.push(material)
      updateCanvasPreview()
      log(`✓ 添加素材: ${material.title} (${material.type})`, 'success')
    }

    // 更新画布预览
    function updateCanvasPreview() {
      const preview = document.getElementById('canvas-preview')

      if (window.canvasItems.length === 0) {
        preview.innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.4);">画布为空</p>'
      } else {
        preview.innerHTML = window.canvasItems.map(item => `
          <div class="canvas-item">
            <div class="icon">${item.icon}</div>
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="type">类型: ${item.type}</div>
            </div>
            <button class="btn-remove" onclick="removeFromCanvas('${item.id}')">移除</button>
          </div>
        `).join('')
      }

      // 更新统计
      document.getElementById('canvas-count').textContent = window.canvasItems.length
      document.getElementById('image-count').textContent = window.canvasItems.filter(i => i.type === 'image').length
      document.getElementById('chart-count').textContent = window.canvasItems.filter(i => i.type === 'chart' || i.type === 'diagram').length
      document.getElementById('other-count').textContent = window.canvasItems.filter(i => !['image', 'chart', 'diagram'].includes(i.type)).length
    }

    // 从画布移除
    window.removeFromCanvas = function(id) {
      const index = window.canvasItems.findIndex(item => item.id === id)
      if (index !== -1) {
        const item = window.canvasItems[index]
        window.canvasItems.splice(index, 1)
        updateCanvasPreview()
        log(`✓ 移除素材: ${item.title}`, 'info')
      }
    }

    // 清空画布
    window.clearCanvas = function() {
      window.canvasItems = []
      updateCanvasPreview()
      log('✓ 画布已清空', 'info')
    }

    // 页面加载时初始化
    window.addEventListener('load', () => {
      log('页面加载完成，初始化服务...', 'info')
      initServices()
    })
  </script>
</body>
</html>
