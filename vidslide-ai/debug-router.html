<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路由调试</title>
</head>
<body>
  <div id="debug-app">
    <h1>🔧 Vue Router 调试页面</h1>

    <div style="margin: 20px 0;">
      <button onclick="checkVue()">检查Vue状态</button>
      <button onclick="checkRouter()">检查路由状态</button>
      <button onclick="testNavigation()">测试导航</button>
    </div>

    <div id="results" style="border: 1px solid #ccc; padding: 10px; margin: 20px 0;">
      <p>调试结果将显示在这里...</p>
    </div>

    <div style="margin: 20px 0;">
      <a href="http://localhost:5175/">访问首页</a> |
      <a href="http://localhost:5175/workspace">访问工作页面</a>
    </div>
  </div>

  <script type="module">
    let results = document.getElementById('results');

    window.checkVue = function() {
      results.innerHTML = '<h3>检查Vue状态:</h3>';

      if (typeof Vue === 'undefined') {
        results.innerHTML += '<p>❌ Vue.js 未加载</p>';
      } else {
        results.innerHTML += '<p>✅ Vue.js 已加载 (版本: ' + Vue.version + ')</p>';
      }

      // 检查Vue实例
      const app = document.querySelector('#app');
      if (app) {
        results.innerHTML += '<p>✅ 找到 #app 元素</p>';
        const vueInstance = app.__vue__;
        if (vueInstance) {
          results.innerHTML += '<p>✅ Vue实例已挂载</p>';
        } else {
          results.innerHTML += '<p>❌ Vue实例未挂载</p>';
        }
      } else {
        results.innerHTML += '<p>❌ 未找到 #app 元素</p>';
      }
    };

    window.checkRouter = function() {
      results.innerHTML = '<h3>检查路由状态:</h3>';

      if (window.router) {
        results.innerHTML += '<p>✅ 路由器已注册</p>';
        results.innerHTML += '<p>当前路由: ' + JSON.stringify(window.router.currentRoute.value) + '</p>';
      } else {
        results.innerHTML += '<p>❌ 路由器未注册</p>';
      }

      results.innerHTML += '<p>当前URL: ' + window.location.href + '</p>';
      results.innerHTML += '<p>路径: ' + window.location.pathname + '</p>';
      results.innerHTML += '<p>Hash: ' + window.location.hash + '</p>';
    };

    window.testNavigation = function() {
      results.innerHTML = '<h3>测试导航:</h3>';

      if (window.router) {
        try {
          window.router.push('/workspace');
          results.innerHTML += '<p>✅ 路由跳转执行成功</p>';
          setTimeout(() => {
            results.innerHTML += '<p>跳转后URL: ' + window.location.href + '</p>';
          }, 100);
        } catch (error) {
          results.innerHTML += '<p>❌ 路由跳转失败: ' + error.message + '</p>';
        }
      } else {
        results.innerHTML += '<p>❌ 无法测试导航: 路由器不存在</p>';
      }
    };

    // 页面加载时自动检查
    window.addEventListener('load', function() {
      setTimeout(() => {
        checkVue();
      }, 500);
    });
  </script>
</body>
</html>
