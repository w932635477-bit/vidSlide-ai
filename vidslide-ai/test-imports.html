<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试模块导入</title>
</head>
<body>
    <h1>测试模块导入</h1>
    <div id="output"></div>

    <script type="module">
        const output = document.getElementById('output')

        try {
            output.innerHTML += '<p>开始导入...</p>'

            const LocalMaterialLibrary = await import('./src/services/LocalMaterialLibrary.js')
            output.innerHTML += '<p>✅ LocalMaterialLibrary 导入成功</p>'

            const FreeAPIService = await import('./src/services/FreeAPIService.js')
            output.innerHTML += '<p>✅ FreeAPIService 导入成功</p>'

            const BaiduImageService = await import('./src/services/BaiduImageService.js')
            output.innerHTML += '<p>✅ BaiduImageService 导入成功</p>'

            const IntelligentDispatcher = await import('./src/services/IntelligentDispatcher.js')
            output.innerHTML += '<p>✅ IntelligentDispatcher 导入成功</p>'

            output.innerHTML += '<p>🎉 所有模块导入成功！</p>'

        } catch (error) {
            output.innerHTML += `<p>❌ 导入失败: ${error.message}</p>`
            console.error(error)
        }
    </script>
</body>
</html>
