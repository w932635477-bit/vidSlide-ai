<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API KEY 测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { border-color: #28a745; background-color: #d4edda; }
        .error { border-color: #dc3545; background-color: #f8d7da; }
        .warning { border-color: #ffc107; background-color: #fff3cd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f8f8f8; border-radius: 3px; }
        pre { white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔑 API KEY 验证测试</h1>

    <div class="test-section" id="pexelsTest">
        <h3>🖼️ Pexels API 测试</h3>
        <button onclick="testPexels()">测试 Pexels API</button>
        <div class="result" id="pexelsResult">等待测试...</div>
    </div>

    <div class="test-section" id="pixabayTest">
        <h3>🖼️ Pixabay API 测试</h3>
        <button onclick="testPixabay()">测试 Pixabay API</button>
        <div class="result" id="pixabayResult">等待测试...</div>
    </div>

    <div class="test-section" id="unsplashTest">
        <h3>🖼️ Unsplash API 测试</h3>
        <button onclick="testUnsplash()">测试 Unsplash API</button>
        <div class="result" id="unsplashResult">等待测试...</div>
    </div>

    <script>
        async function testPexels() {
            const resultDiv = document.getElementById('pexelsResult');
            const sectionDiv = document.getElementById('pexelsTest');

            resultDiv.textContent = '🔄 正在测试 Pexels API...';
            sectionDiv.className = 'test-section';

            try {
                const response = await fetch('https://api.pexels.com/v1/search?query=test&per_page=1', {
                    headers: {
                        'Authorization': 'J5I7XwR4QFUfDERCjGBdQw70EO28x543C54PZiTEOOugNQEOREvFnVC0'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>✅ Pexels API 工作正常!</strong><br>
                        状态码: ${response.status}<br>
                        返回图片数量: ${data.photos ? data.photos.length : 'N/A'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('success');
                } else {
                    resultDiv.innerHTML = `
                        <strong>❌ Pexels API 错误</strong><br>
                        状态码: ${response.status}<br>
                        错误信息: ${data.error || '未知错误'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <strong>❌ 网络错误</strong><br>
                    错误信息: ${error.message}
                `;
                sectionDiv.classList.add('error');
            }
        }

        async function testPixabay() {
            const resultDiv = document.getElementById('pixabayResult');
            const sectionDiv = document.getElementById('pixabayTest');

            resultDiv.textContent = '🔄 正在测试 Pixabay API...';
            sectionDiv.className = 'test-section';

            try {
                const response = await fetch('https://pixabay.com/api/?key=52722038-7ac4769e00433c06f9c6333bc&q=test&per_page=1');

                const data = await response.json();

                if (response.ok && !data.error) {
                    resultDiv.innerHTML = `
                        <strong>✅ Pixabay API 工作正常!</strong><br>
                        状态码: ${response.status}<br>
                        返回图片数量: ${data.hits ? data.hits.length : 'N/A'}<br>
                        总数: ${data.total || 'N/A'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('success');
                } else {
                    resultDiv.innerHTML = `
                        <strong>❌ Pixabay API 错误</strong><br>
                        状态码: ${response.status}<br>
                        错误信息: ${data.error || '未知错误'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <strong>❌ 网络错误</strong><br>
                    错误信息: ${error.message}
                `;
                sectionDiv.classList.add('error');
            }
        }

        async function testUnsplash() {
            const resultDiv = document.getElementById('unsplashResult');
            const sectionDiv = document.getElementById('unsplashTest');

            resultDiv.textContent = '🔄 正在测试 Unsplash API...';
            sectionDiv.className = 'test-section';

            try {
                const response = await fetch('https://api.unsplash.com/search/photos?query=test&per_page=1', {
                    headers: {
                        'Authorization': 'Client-ID zPjqHo_L8Vx-gckbifgYM1bJxnYbFRgFXLXFwWcAN30'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>✅ Unsplash API 工作正常!</strong><br>
                        状态码: ${response.status}<br>
                        返回图片数量: ${data.results ? data.results.length : 'N/A'}<br>
                        总数: ${data.total || 'N/A'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('success');
                } else {
                    resultDiv.innerHTML = `
                        <strong>❌ Unsplash API 错误</strong><br>
                        状态码: ${response.status}<br>
                        错误信息: ${data.errors ? data.errors.join(', ') : '未知错误'}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    sectionDiv.classList.add('error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <strong>❌ 网络错误</strong><br>
                    错误信息: ${error.message}
                `;
                sectionDiv.classList.add('error');
            }
        }

        // 页面加载完成后自动测试
        window.addEventListener('load', () => {
            console.log('API KEY 测试页面已加载');
        });
    </script>
</body>
</html>
