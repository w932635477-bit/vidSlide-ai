<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialService 测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 20px 0; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 MaterialService 导入测试</h1>

    <button onclick="testImport()">测试MaterialService导入</button>
    <button onclick="testInitialization()">测试服务初始化</button>

    <div id="results"></div>

    <script type="module">
        let materialServiceInstance = null;

        async function testImport() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">🔄 正在测试MaterialService导入...</div>';

            try {
                // 测试导入
                const MaterialService = await import('./src/services/MaterialService.js');
                materialServiceInstance = MaterialService.default;

                console.log('MaterialService导入结果:', materialServiceInstance);
                console.log('类型:', typeof materialServiceInstance);
                console.log('是否为对象:', typeof materialServiceInstance === 'object');
                console.log('是否有searchMaterials方法:', typeof materialServiceInstance.searchMaterials === 'function');

                resultsDiv.innerHTML += `
                    <div class="result success">
                        ✅ MaterialService导入成功<br>
                        类型: ${typeof materialServiceInstance}<br>
                        是否为对象: ${typeof materialServiceInstance === 'object'}<br>
                        包含searchMaterials方法: ${typeof materialServiceInstance.searchMaterials === 'function'}
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        ❌ MaterialService导入失败: ${error.message}<br>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        async function testInitialization() {
            const resultsDiv = document.getElementById('results');

            if (!materialServiceInstance) {
                resultsDiv.innerHTML += '<div class="result error">❌ 请先测试导入</div>';
                return;
            }

            resultsDiv.innerHTML += '<div class="result">🔄 正在测试服务初始化...</div>';

            try {
                // 测试初始化
                await materialServiceInstance.initialize();

                resultsDiv.innerHTML += `
                    <div class="result success">
                        ✅ MaterialService初始化成功
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        ❌ MaterialService初始化失败: ${error.message}<br>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        // 自动测试导入
        window.addEventListener('load', () => {
            setTimeout(testImport, 500);
        });
    </script>
</body>
</html>
