<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地素材库检查工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { border-color: #28a745; background-color: #d4edda; }
        .info { border-color: #17a2b8; background-color: #d1ecf1; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #333; }
        .stat-label { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🔍 本地素材库检查工具</h1>

    <div>
        <button onclick="checkMaterials()">🔍 检查素材库</button>
        <button onclick="checkDeduplication()">🔄 执行去重</button>
        <button onclick="clearAllMaterials()">🗑️ 清空所有素材</button>
        <button onclick="exportStats()">📊 导出统计</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">总素材数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="externalCount">0</div>
            <div class="stat-label">外部素材</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="localCount">0</div>
            <div class="stat-label">本地素材</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="duplicateCount">0</div>
            <div class="stat-label">重复素材</div>
        </div>
    </div>

    <div class="result" id="result">
        <strong>状态：</strong>等待检查...
    </div>

    <div class="result info" id="details" style="display: none;">
        <strong>详细统计：</strong>
        <pre id="detailsContent"></pre>
    </div>

    <!-- 加载必要的脚本 -->
    <script type="module">
        import LocalMaterialLibrary from './src/services/LocalMaterialLibrary.js';

        let library = null;

        async function initialize() {
            if (!library) {
                library = LocalMaterialLibrary;
                await library.initialize();
                log('✅ 本地素材库初始化完成');
            }
            return library;
        }

        window.checkMaterials = async function() {
            try {
                log('🔍 正在检查素材库...');
                const lib = await initialize();
                const stats = await lib.getStatistics();

                // 获取所有素材进行详细统计
                const allMaterials = await getAllMaterials();

                updateStatsDisplay(stats, allMaterials);

                log(`✅ 检查完成！共找到 ${allMaterials.length} 个素材`);

            } catch (error) {
                log('❌ 检查失败: ' + error.message);
                console.error(error);
            }
        };

        window.checkDeduplication = async function() {
            try {
                log('🔄 正在执行去重检查...');
                const lib = await initialize();
                const allMaterials = await getAllMaterials();

                let duplicatesFound = 0;
                const seenUrls = new Set();
                const seenTitles = new Set();

                for (const material of allMaterials) {
                    const urlKey = material.url || material.dataUrl;
                    const titleKey = material.title || material.id;

                    if (urlKey && seenUrls.has(urlKey)) {
                        duplicatesFound++;
                        log(`🔍 发现URL重复: ${titleKey}`);
                    } else if (urlKey) {
                        seenUrls.add(urlKey);
                    }

                    if (titleKey && seenTitles.has(titleKey)) {
                        duplicatesFound++;
                        log(`🔍 发现标题重复: ${titleKey}`);
                    } else if (titleKey) {
                        seenTitles.add(titleKey);
                    }
                }

                log(`✅ 去重检查完成！发现 ${duplicatesFound} 个潜在重复`);

            } catch (error) {
                log('❌ 去重检查失败: ' + error.message);
                console.error(error);
            }
        };

        window.clearAllMaterials = async function() {
            if (!confirm('确定要清空所有素材吗？此操作不可恢复！')) {
                return;
            }

            try {
                log('🗑️ 正在清空所有素材...');
                const lib = await initialize();
                await lib.clearAllMaterials();
                log('✅ 素材已清空');
                updateStatsDisplay({ totalMaterials: 0, externalMaterials: 0, localMaterials: 0 }, []);
            } catch (error) {
                log('❌ 清空失败: ' + error.message);
                console.error(error);
            }
        };

        window.exportStats = async function() {
            try {
                log('📊 正在导出统计...');
                const lib = await initialize();
                const stats = await lib.getStatistics();
                const allMaterials = await getAllMaterials();

                const exportData = {
                    timestamp: new Date().toISOString(),
                    summary: stats,
                    materials: allMaterials.map(m => ({
                        id: m.id,
                        title: m.title,
                        source: m.source,
                        category: m.category,
                        url: m.url || m.dataUrl,
                        size: m.size || 0
                    }))
                };

                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `material-stats-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);

                log('✅ 统计已导出');

            } catch (error) {
                log('❌ 导出失败: ' + error.message);
                console.error(error);
            }
        };

        async function getAllMaterials() {
            // 由于LocalMaterialLibrary可能没有getAllMaterials方法，我们使用searchMaterials
            const results = await library.searchMaterials('', { limit: 10000 }); // 获取大量素材
            return results.cached || [];
        }

        function updateStatsDisplay(stats, allMaterials) {
            document.getElementById('totalCount').textContent = allMaterials.length;
            document.getElementById('externalCount').textContent = stats.externalMaterials || 0;
            document.getElementById('localCount').textContent = stats.localMaterials || 0;

            // 简单计算重复数（这里只是估算，实际去重需要更复杂的逻辑）
            const urls = new Set();
            let duplicates = 0;
            allMaterials.forEach(m => {
                const url = m.url || m.dataUrl;
                if (url && urls.has(url)) {
                    duplicates++;
                } else if (url) {
                    urls.add(url);
                }
            });
            document.getElementById('duplicateCount').textContent = duplicates;

            // 显示详细统计
            const details = {
                summary: stats,
                totalMaterials: allMaterials.length,
                cachedMaterials: stats.cachedMaterials || 0,
                cacheSize: stats.cacheSize || 0,
                bySource: {},
                byCategory: {}
            };

            allMaterials.forEach(m => {
                const source = m.source || 'unknown';
                const category = m.category || 'uncategorized';

                details.bySource[source] = (details.bySource[source] || 0) + 1;
                details.byCategory[category] = (details.byCategory[category] || 0) + 1;
            });

            document.getElementById('detailsContent').textContent = JSON.stringify(details, null, 2);
            document.getElementById('details').style.display = 'block';
        }

        function log(message) {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            resultDiv.innerHTML = `<strong>状态：</strong>[${timestamp}] ${message}`;
            console.log(message);
        }

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            log('本地素材库检查工具已就绪');
        });
    </script>
</body>
</html>
