<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件导入测试</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>组件导入测试</h1>
    
    <div class="test-result info">正在测试组件导入...</div>
    
    <div id="test-container"></div>

    <script type="module">
        const resultDiv = document.querySelector('.test-result');
        
        async function testImport(componentName, importPath) {
            try {
                resultDiv.innerHTML = `正在导入 ${componentName}...`;
                const module = await import(importPath);
                
                if (module.default) {
                    resultDiv.innerHTML = `✅ ${componentName} 导入成功！`;
                    resultDiv.className = 'test-result success';
                    console.log(`${componentName} 导入成功:`, module);
                    return true;
                } else {
                    resultDiv.innerHTML = `❌ ${componentName} 没有默认导出`;
                    resultDiv.className = 'test-result error';
                    console.log(`${componentName} 导出内容:`, Object.keys(module));
                    return false;
                }
            } catch (error) {
                resultDiv.innerHTML = `❌ ${componentName} 导入失败: ${error.message}`;
                resultDiv.className = 'test-result error';
                console.error(`${componentName} 导入错误:`, error);
                return false;
            }
        }
        
        // 测试关键组件
        const tests = [
            { name: 'TemplateRenderer', path: './src/utils/TemplateRenderer.js' },
            { name: 'TemplateSelector', path: './src/components/templates/TemplateSelector.vue' },
            { name: 'UserAdjustmentPanel', path: './src/components/UserAdjustmentPanel.vue' },
            { name: 'VideoEditorView', path: './src/views/VideoEditorView.vue' }
        ];
        
        for (const test of tests) {
            const success = await testImport(test.name, test.path);
            if (!success) break;
            await new Promise(resolve => setTimeout(resolve, 500));
        }
        
        resultDiv.innerHTML = '🎯 所有导入测试完成！检查控制台日志。';
        resultDiv.className = 'test-result info';
    </script>
</body>
</html>
