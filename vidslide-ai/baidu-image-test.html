<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度图片API测试 - VidSlide AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1976d2 0%, #7b1fa2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e3f2fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .api-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border-left: 5px solid #1976d2;
            transition: transform 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
        }

        .status-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .status-card .metric {
            font-size: 2em;
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 5px;
        }

        .status-card .label {
            color: #666;
            font-size: 0.9em;
        }

        .test-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .test-section h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .test-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .test-form input,
        .test-form select,
        .test-form button {
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1em;
        }

        .test-form input {
            flex: 1;
            min-width: 250px;
        }

        .test-form select {
            min-width: 100px;
        }

        .test-form button {
            background: linear-gradient(135deg, #1976d2 0%, #7b1fa2 100%);
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .test-form button:hover {
            transform: translateY(-2px);
        }

        .test-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
        }

        .result-card:hover {
            transform: translateY(-5px);
            border-color: #1976d2;
        }

        .result-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .result-card .info {
            padding: 15px;
        }

        .result-card .title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
            line-height: 1.3;
        }

        .result-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .result-card .source {
            background: #1976d2;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .result-card .dimensions {
            color: #666;
            font-size: 0.8em;
        }

        .result-card .url {
            color: #666;
            font-size: 0.8em;
            word-break: break-all;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            grid-column: 1 / -1;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            grid-column: 1 / -1;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            grid-column: 1 / -1;
        }

        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 1.5em;
            font-weight: bold;
            color: #1976d2;
        }

        .stat-item .label {
            color: #666;
            font-size: 0.9em;
        }

        .footer {
            background: #343a40;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .footer a {
            color: #4dabf7;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .api-status,
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .test-form {
                flex-direction: column;
                align-items: stretch;
            }

            .results {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .api-status,
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ 百度图片API测试</h1>
            <p>测试VidSlide AI国内素材源集成 - 百度图片搜索</p>
        </div>

        <div class="content">
            <!-- API状态监控 -->
            <div class="api-status">
                <div class="status-card">
                    <h3>🔍 API状态</h3>
                    <div class="metric" id="api-status">未知</div>
                    <div class="label">连接状态</div>
                </div>
                <div class="status-card">
                    <h3>📊 调用次数</h3>
                    <div class="metric" id="call-count">0</div>
                    <div class="label">本次会话</div>
                </div>
                <div class="status-card">
                    <h3>⚡ 响应时间</h3>
                    <div class="metric" id="response-time">-</div>
                    <div class="label">毫秒</div>
                </div>
                <div class="status-card">
                    <h3>🎯 成功率</h3>
                    <div class="metric" id="success-rate">0%</div>
                    <div class="label">调用成功率</div>
                </div>
            </div>

            <!-- 测试区域 -->
            <div class="test-section">
                <h2>🧪 API功能测试</h2>

                <form class="test-form" onsubmit="runTest(event)">
                    <input type="text" id="query" placeholder="输入中文关键词测试 (如: 春节、国庆、AI)" required>
                    <select id="limit">
                        <option value="3">3张图片</option>
                        <option value="6" selected>6张图片</option>
                        <option value="9">9张图片</option>
                        <option value="12">12张图片</option>
                    </select>
                    <button type="submit" id="test-btn">🚀 开始测试</button>
                </form>

                <!-- 测试统计 -->
                <div class="stats-section">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="number" id="total-tests">0</div>
                            <div class="label">总测试次数</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="success-tests">0</div>
                            <div class="label">成功次数</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="last-query">-</div>
                            <div class="label">最后查询</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="images-found">0</div>
                            <div class="label">找到图片</div>
                        </div>
                    </div>
                </div>

                <div id="test-results">
                    <div class="loading" style="display: none;">
                        🔍 正在搜索百度图片，请稍候...
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>🎉 VidSlide AI - 集成百度图片API，专注国内热点素材</p>
            <p>📖 相关文档请在项目目录中查看：<code>CHINESE_MATERIAL_SCHEME_ANALYSIS.md</code> | <code>ENHANCED_FREE_API_STRATEGY.md</code></p>
        </div>
    </div>

    <script>
        // 测试统计
        let testStats = {
            totalTests: 0,
            successTests: 0,
            callCount: 0,
            responseTimes: [],
            lastQuery: '-',
            imagesFound: 0
        }

        // 更新UI显示
        function updateUI() {
            document.getElementById('call-count').textContent = testStats.callCount
            document.getElementById('total-tests').textContent = testStats.totalTests
            document.getElementById('success-tests').textContent = testStats.successTests
            document.getElementById('last-query').textContent = testStats.lastQuery
            document.getElementById('images-found').textContent = testStats.imagesFound

            // 计算平均响应时间
            if (testStats.responseTimes.length > 0) {
                const avgTime = Math.round(testStats.responseTimes.reduce((a, b) => a + b, 0) / testStats.responseTimes.length)
                document.getElementById('response-time').textContent = avgTime
            }

            // 计算成功率
            const successRate = testStats.totalTests > 0 ? Math.round((testStats.successTests / testStats.totalTests) * 100) : 0
            document.getElementById('success-rate').textContent = successRate + '%'
        }

        // 测试百度图片API
        async function runTest(event) {
            event.preventDefault()

            const query = document.getElementById('query').value.trim()
            const limit = parseInt(document.getElementById('limit').value)
            const testBtn = document.getElementById('test-btn')
            const resultsDiv = document.getElementById('test-results')

            if (!query) {
                alert('请输入搜索关键词')
                return
            }

            // 更新统计
            testStats.totalTests++
            testStats.callCount++
            testStats.lastQuery = query.substring(0, 10) + (query.length > 10 ? '...' : '')
            updateUI()

            // 禁用按钮，显示加载状态
            testBtn.disabled = true
            testBtn.textContent = '🔍 搜索中...'
            resultsDiv.innerHTML = '<div class="loading">🔍 正在搜索百度图片，请稍候...</div>'

            const startTime = Date.now()

            try {
                // 调用代理API
                const response = await fetch('http://localhost:34567/proxy-test-baidu-image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: limit
                    })
                })

                const endTime = Date.now()
                const responseTime = endTime - startTime
                testStats.responseTimes.push(responseTime)

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`)
                }

                const data = await response.json()

                // 更新统计
                testStats.successTests++
                if (data.images) {
                    testStats.imagesFound = data.images.length
                }
                updateUI()

                // 更新API状态
                document.getElementById('api-status').textContent = '✅ 正常'
                document.getElementById('api-status').style.color = '#28a745'

                // 显示结果
                displayResults(data, query, responseTime)

            } catch (error) {
                console.error('测试失败:', error)

                // 更新API状态
                document.getElementById('api-status').textContent = '❌ 异常'
                document.getElementById('api-status').style.color = '#dc3545'

                // 显示错误信息
                resultsDiv.innerHTML = `<div class="error">❌ 测试失败: ${error.message}<br><br>可能原因：<br>• 代理服务器未启动<br>• 网络连接问题<br>• API配置错误<br><br>请检查代理服务器状态：http://localhost:34567</div>`

            } finally {
                // 恢复按钮状态
                testBtn.disabled = false
                testBtn.textContent = '🚀 开始测试'
            }
        }

        // 显示搜索结果
        function displayResults(data, query, responseTime) {
            const resultsDiv = document.getElementById('test-results')

            if (!data.success) {
                resultsDiv.innerHTML = `<div class="error">❌ API调用失败: ${data.error || '未知错误'}</div>`
                return
            }

            if (!data.images || data.images.length === 0) {
                resultsDiv.innerHTML = `<div class="error">❌ 没有找到相关图片，请尝试其他关键词</div>`
                return
            }

            const resultsHtml = `
                <div class="success">
                    🎉 搜索成功！关键词 "${query}" 找到 ${data.images.length} 张图片<br>
                    <small>响应时间: ${responseTime}ms | 来源: 百度图片搜索</small>
                </div>
                <div class="results">
                    ${data.images.map(image => `
                        <div class="result-card">
                            <img src="${image.thumbnail}" alt="${image.title}"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4='">
                            <div class="info">
                                <div class="title">${image.title || '百度图片'}</div>
                                <div class="meta">
                                    <span class="source">百度</span>
                                    <span class="dimensions">${image.width || '?'}×${image.height || '?'}</span>
                                </div>
                                <div class="url" title="${image.url}">${image.url.substring(0, 40)}...</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="text-align: center; margin-top: 20px; color: #666;">
                    💡 <strong>集成状态:</strong> 百度图片API已集成到VidSlide AI素材服务中<br>
                    🇨🇳 <strong>中文关键词</strong>会自动优先调用百度图片，提升国内热点素材覆盖率
                </div>
            `

            resultsDiv.innerHTML = resultsHtml
        }

        // 页面加载时的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 VidSlide AI 百度图片API测试页面已加载')

            // 检查代理服务器状态
            checkProxyStatus()

            // 更新UI
            updateUI()
        })

        // 检查代理服务器状态
        async function checkProxyStatus() {
            try {
                const response = await fetch('http://localhost:34567/', { method: 'HEAD' })
                if (response.ok) {
                    document.getElementById('api-status').textContent = '✅ 正常'
                    document.getElementById('api-status').style.color = '#28a745'
                } else {
                    throw new Error()
                }
            } catch (error) {
                document.getElementById('api-status').textContent = '❌ 未连接'
                document.getElementById('api-status').style.color = '#dc3545'
                document.getElementById('test-results').innerHTML =
                    '<div class="error">⚠️ 代理服务器未启动<br><br>请先启动代理服务器：<br><code>cd vidslide-ai && node proxy-test-server.js</code></div>'
            }
        }

        // 自动刷新API状态
        setInterval(checkProxyStatus, 10000)
    </script>
</body>
</html>
