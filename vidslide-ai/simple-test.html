<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单JavaScript测试</title>
</head>
<body>
  <div id="test">
    <h1>🔬 JavaScript 执行测试</h1>
    <button onclick="testFunction()">点击测试</button>
    <div id="result"></div>
  </div>

  <script>
    function testFunction() {
      document.getElementById('result').innerHTML = '✅ JavaScript 执行正常！时间: ' + new Date().toLocaleString();
      console.log('✅ JavaScript 执行测试通过');
    }

    // 页面加载测试
    window.onload = function() {
      console.log('✅ 页面加载完成');
      document.getElementById('result').innerHTML = '✅ 页面加载完成';
    };

    console.log('✅ HTML内联脚本执行');
  </script>
</body>
</html>
