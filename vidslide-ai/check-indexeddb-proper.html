<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB 数据库检查工具</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5em; }
        .result { margin: 20px 0; padding: 20px; border-radius: 10px; }
        .success { background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; }
        .error { background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; }
        .info { background: rgba(23, 162, 184, 0.2); border: 1px solid #17a2b8; }
        .warning { background: rgba(255, 193, 7, 0.2); border: 1px solid #ffc107; }
        button { padding: 12px 25px; margin: 10px; border: none; border-radius: 25px; cursor: pointer; font-size: 1.1em; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .stat-number { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .stat-label { font-size: 1.1em; opacity: 0.9; }
        .database-list { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin: 20px 0; }
        .db-item { padding: 15px; margin: 10px 0; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 4px solid #667eea; }
        .store-item { padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.05); border-radius: 5px; border-left: 3px solid #28a745; }
        .code { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; font-family: monospace; margin: 10px 0; overflow-x: auto; }
        .source-info { background: rgba(255, 193, 7, 0.1); border: 1px solid #ffc107; padding: 15px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 IndexedDB 数据库检查工具</h1>

        <div class="source-info">
            <h3>📍 当前页面信息</h3>
            <p><strong>协议:</strong> <span id="protocol"></span></p>
            <p><strong>域名:</strong> <span id="hostname"></span></p>
            <p><strong>端口:</strong> <span id="port"></span></p>
            <p><strong>完整源:</strong> <span id="origin"></span></p>
            <p><em>IndexedDB数据按源隔离，只有相同源的页面才能访问相同的数据</em></p>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <button id="checkBtn" class="btn-primary">🔍 检查IndexedDB</button>
            <button id="clearBtn" class="btn-secondary">🗑️ 清空所有数据</button>
            <button id="refreshBtn" class="btn-secondary">🔄 刷新页面</button>
        </div>

        <div id="results"></div>

        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">数据库数量</div>
                <div class="stat-number" id="dbCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总对象存储</div>
                <div class="stat-number" id="storeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总记录数</div>
                <div class="stat-number" id="recordCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">VidSlide数据库</div>
                <div class="stat-number" id="vidslideCount">0</div>
            </div>
        </div>

        <div id="databaseList" style="display: none;">
            <h3>📊 数据库详情</h3>
            <div class="database-list" id="dbList"></div>
        </div>
    </div>

    <script>
        // 显示当前页面源信息
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('hostname').textContent = window.location.hostname;
        document.getElementById('port').textContent = window.location.port || '80 (默认)';
        document.getElementById('origin').textContent = window.location.origin;

        async function checkIndexedDB() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result info">🔍 正在扫描IndexedDB...</div>';

            try {
                // 检查浏览器支持
                if (!window.indexedDB) {
                    throw new Error('❌ 浏览器不支持IndexedDB');
                }

                resultsDiv.innerHTML += '<div class="result info">✅ IndexedDB支持检测通过</div>';

                // 获取所有数据库
                const databases = await indexedDB.databases();
                console.log('所有数据库:', databases);

                const dbCount = databases.length;
                document.getElementById('dbCount').textContent = dbCount;

                if (dbCount === 0) {
                    resultsDiv.innerHTML += '<div class="result warning">⚠️ 未找到任何IndexedDB数据库</div>';
                    resultsDiv.innerHTML += '<div class="result info">💡 可能的原因：<br>• 这是新环境，尚未创建数据库<br>• 数据存储在不同端口/域名的源中<br>• 浏览器隐私设置阻止了IndexedDB</div>';

                    // 检查VidSlide相关的数据库
                    const vidslideDBs = databases.filter(db => db.name && db.name.includes('VidSlide'));
                    if (vidslideDBs.length === 0) {
                        resultsDiv.innerHTML += '<div class="result error">❌ 未找到VidSlide相关的数据库</div>';
                        resultsDiv.innerHTML += '<div class="result info">🔧 建议：<br>1. 访问 http://localhost:5173/material-viewer.html 创建数据<br>2. 确保在相同端口下检查<br>3. 检查浏览器是否启用了IndexedDB</div>';
                    }

                    return;
                }

                resultsDiv.innerHTML += `<div class="result success">✅ 找到 ${dbCount} 个数据库</div>`;

                // 分析数据库详情
                let totalStores = 0;
                let totalRecords = 0;
                let vidslideStores = 0;

                const dbListDiv = document.getElementById('dbList');
                dbListDiv.innerHTML = '';

                for (const dbInfo of databases) {
                    const dbItem = document.createElement('div');
                    dbItem.className = 'db-item';
                    dbItem.innerHTML = `
                        <h4>📁 数据库: ${dbInfo.name || '未命名'}</h4>
                        <p>版本: ${dbInfo.version || '未知'}</p>
                        <div id="stores-${dbInfo.name}"></div>
                    `;

                    try {
                        // 尝试打开数据库获取更多信息
                        const db = await openDatabase(dbInfo.name, dbInfo.version);
                        const stores = Array.from(db.objectStoreNames);

                        totalStores += stores.length;

                        const storesDiv = dbItem.querySelector(`#stores-${dbInfo.name}`);
                        storesDiv.innerHTML = `<p><strong>对象存储 (${stores.length}):</strong> ${stores.join(', ')}</p>`;

                        // 检查每个存储的记录数
                        for (const storeName of stores) {
                            try {
                                const count = await getStoreCount(db, storeName);
                                totalRecords += count;

                                if (dbInfo.name && dbInfo.name.includes('VidSlide')) {
                                    vidslideStores++;
                                }

                                const storeItem = document.createElement('div');
                                storeItem.className = 'store-item';
                                storeItem.innerHTML = `<strong>${storeName}:</strong> ${count} 条记录`;
                                storesDiv.appendChild(storeItem);

                            } catch (storeError) {
                                storesDiv.innerHTML += `<div class="store-item">❌ ${storeName}: 无法读取 (${storeError.message})</div>`;
                            }
                        }

                        db.close();

                    } catch (dbError) {
                        dbItem.innerHTML += `<p>❌ 无法访问数据库详情: ${dbError.message}</p>`;
                    }

                    dbListDiv.appendChild(dbItem);
                }

                // 更新统计
                document.getElementById('storeCount').textContent = totalStores;
                document.getElementById('recordCount').textContent = totalRecords;
                document.getElementById('vidslideCount').textContent = vidslideStores;

                // 显示结果
                document.getElementById('statsGrid').style.display = 'grid';
                document.getElementById('databaseList').style.display = 'block';

                if (vidslideStores > 0) {
                    resultsDiv.innerHTML += '<div class="result success">🎉 找到VidSlide数据库！素材数据已成功存储</div>';
                } else {
                    resultsDiv.innerHTML += '<div class="result warning">⚠️ 未找到VidSlide数据库，可能数据存储在其他源中</div>';
                }

            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">❌ 检查失败: ${error.message}</div>`;
                console.error('IndexedDB检查错误:', error);
            }
        }

        async function clearIndexedDB() {
            const resultsDiv = document.getElementById('results');

            if (!confirm('⚠️ 确定要清空所有IndexedDB数据吗？这将删除所有本地存储的素材！')) {
                return;
            }

            resultsDiv.innerHTML = '<div class="result warning">🗑️ 正在清空IndexedDB...</div>';

            try {
                const databases = await indexedDB.databases();
                let deletedCount = 0;

                for (const dbInfo of databases) {
                    if (dbInfo.name) {
                        try {
                            await deleteDatabase(dbInfo.name);
                            resultsDiv.innerHTML += `<div class="result success">✅ 已删除数据库: ${dbInfo.name}</div>`;
                            deletedCount++;
                        } catch (deleteError) {
                            resultsDiv.innerHTML += `<div class="result error">❌ 删除失败 ${dbInfo.name}: ${deleteError.message}</div>`;
                        }
                    }
                }

                if (deletedCount > 0) {
                    resultsDiv.innerHTML += `<div class="result success">🎉 成功删除 ${deletedCount} 个数据库</div>`;
                } else {
                    resultsDiv.innerHTML += '<div class="result info">ℹ️ 没有找到可删除的数据库</div>';
                }

            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">❌ 清空失败: ${error.message}</div>`;
            }
        }

        function openDatabase(name, version) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(name, version);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
                request.onblocked = () => reject(new Error('数据库打开被阻止'));
                request.onupgradeneeded = () => {
                    // 如果版本不匹配，使用最新版本重试
                    const db = request.result;
                    db.close();
                    openDatabase(name).then(resolve).catch(reject);
                };
            });
        }

        function getStoreCount(db, storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const countRequest = store.count();

                countRequest.onsuccess = () => resolve(countRequest.result);
                countRequest.onerror = () => reject(countRequest.error);
            });
        }

        function deleteDatabase(name) {
            return new Promise((resolve, reject) => {
                const deleteRequest = indexedDB.deleteDatabase(name);

                deleteRequest.onsuccess = () => resolve();
                deleteRequest.onerror = () => reject(deleteRequest.error);
                deleteRequest.onblocked = () => reject(new Error('数据库删除被阻止'));
            });
        }

        // 绑定事件
        document.getElementById('checkBtn').addEventListener('click', checkIndexedDB);
        document.getElementById('clearBtn').addEventListener('click', clearIndexedDB);
        document.getElementById('refreshBtn').addEventListener('click', () => location.reload());

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkIndexedDB();
            }, 500);
        });
    </script>
</body>
</html>
