<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoEditorView 测试</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>VideoEditorView 组件测试</h1>
    <div id="test-app">
        <div class="test-result success">开始测试...</div>
        <div id="component-container"></div>
    </div>

    <script type="module">
        const results = document.querySelector('.test-result');

        try {
            // 测试组件导入
            results.innerHTML = '正在导入VideoEditorView组件...';
            const { default: VideoEditorView } = await import('./src/views/VideoEditorView.vue');
            results.innerHTML = '✅ VideoEditorView组件导入成功！';
            results.className = 'test-result success';

            // 测试组件渲染
            const app = Vue.createApp({
                components: { VideoEditorView },
                template: '<VideoEditorView />'
            });

            app.mount('#component-container');

            setTimeout(() => {
                const container = document.getElementById('component-container');
                if (container.innerHTML.includes('video-editor-view')) {
                    results.innerHTML = '✅ VideoEditorView组件渲染成功！';
                } else {
                    results.innerHTML = '❌ VideoEditorView组件渲染失败';
                    results.className = 'test-result error';
                }
            }, 1000);

        } catch (error) {
            results.innerHTML = `❌ 测试失败: ${error.message}`;
            results.className = 'test-result error';
            console.error('VideoEditorView测试错误:', error);
        }
    </script>
</body>
</html>
