<body>
    <h1>百度翻译API测试工具</h1>

    <script>
        // MD5函数
        function md5(str) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
                .then(hash => {
                    const hex = Array.from(new Uint8Array(hash))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');
                    // 简单MD5模拟 (实际应该使用crypto-js)
                    let hash2 = 0;
                    for (let i = 0; i < str.length; i++) {
                        const char = str.charCodeAt(i);
                        hash2 = ((hash2 << 5) - hash2) + char;
                        hash2 = hash2 & hash2;
                    }
                    return Math.abs(hash2).toString(16);
                });
        }

        // MD5实现 (兼容浏览器环境)
        function md5(str) {
            // 使用一个标准的MD5实现
            function addUnsigned(lX, lY) {
                const lX8 = (lX & 0x80000000);
                const lY8 = (lY & 0x80000000);
                const lX4 = (lX & 0x40000000);
                const lY4 = (lY & 0x40000000);
                const lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
                if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
                if (lX4 | lY4) {
                    if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
                    else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
                } else return (lResult ^ lX8 ^ lY8);
            }

            function F(x, y, z) { return (x & y) | (~x & z); }
            function G(x, y, z) { return (x & z) | (y & ~z); }
            function H(x, y, z) { return (x ^ y ^ z); }
            function I(x, y, z) { return (y ^ (x | ~z)); }

            function FF(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
                return addUnsigned(leftRotate(a, s), b);
            }

            function GG(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
                return addUnsigned(leftRotate(a, s), b);
            }

            function HH(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
                return addUnsigned(leftRotate(a, s), b);
            }

            function II(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
                return addUnsigned(leftRotate(a, s), b);
            }

            function leftRotate(value, amount) {
                return (value << amount) | (value >>> (32 - amount));
            }

            function convertToWordArray(str) {
                const messageLength = str.length;
                const numberOfWordsTemp1 = (((messageLength + 8) >>> 6) + 1) * 16;
                const numberOfWordsTemp2 = (numberOfWordsTemp1 - 1) * 16;
                const wordArray = [];
                let bytePosition = 0;
                let byteCount = 0;

                while (byteCount < numberOfWordsTemp2) {
                    const count = (byteCount - (byteCount % 4)) / 4;
                    bytePosition = (byteCount % 4) * 8;
                    wordArray[count] = (wordArray[count] | (str.charCodeAt(byteCount) << bytePosition));
                    byteCount++;
                }

                const count2 = (byteCount - (byteCount % 4)) / 4;
                const bytePosition2 = (byteCount % 4) * 8;
                wordArray[count2] = wordArray[count2] | (0x80 << bytePosition2);
                wordArray[numberOfWordsTemp1 - 2] = messageLength << 3;
                wordArray[numberOfWordsTemp1 - 1] = messageLength >>> 29;

                return wordArray;
            }

            function wordToHex(value) {
                let hex = '';
                for (let i = 0; i <= 3; i++) {
                    const byte = (value >>> (i * 8)) & 255;
                    hex += ('0' + byte.toString(16)).slice(-2);
                }
                return hex;
            }

            const x = convertToWordArray(str);
            let a = 0x67452301;
            let b = 0xEFCDAB89;
            let c = 0x98BADCFE;
            let d = 0x10325476;

            for (let i = 0; i < x.length; i += 16) {
                const AA = a, BB = b, CC = c, DD = d;

                a = FF(a, b, c, d, x[i + 0], 7, 0xD76AA478);
                d = FF(d, a, b, c, x[i + 1], 12, 0xE8C7B756);
                c = FF(c, d, a, b, x[i + 2], 17, 0x242070DB);
                b = FF(b, c, d, a, x[i + 3], 22, 0xC1BDCEEE);
                a = FF(a, b, c, d, x[i + 4], 7, 0xF57C0FAF);
                d = FF(d, a, b, c, x[i + 5], 12, 0x4787C62A);
                c = FF(c, d, a, b, x[i + 6], 17, 0xA8304613);
                b = FF(b, c, d, a, x[i + 7], 22, 0xFD469501);
                a = FF(a, b, c, d, x[i + 8], 7, 0x698098D8);
                d = FF(d, a, b, c, x[i + 9], 12, 0x8B44F7AF);
                c = FF(c, d, a, b, x[i + 10], 17, 0xFFFF5BB1);
                b = FF(b, c, d, a, x[i + 11], 22, 0x895CD7BE);
                a = FF(a, b, c, d, x[i + 12], 7, 0x6B901122);
                d = FF(d, a, b, c, x[i + 13], 12, 0xFD987193);
                c = FF(c, d, a, b, x[i + 14], 17, 0xA679438E);
                b = FF(b, c, d, a, x[i + 15], 22, 0x49B40821);

                a = GG(a, b, c, d, x[i + 1], 5, 0xF61E2562);
                d = GG(d, a, b, c, x[i + 6], 9, 0xC040B340);
                c = GG(c, d, a, b, x[i + 11], 14, 0x265E5A51);
                b = GG(b, c, d, a, x[i + 0], 20, 0xE9B6C7AA);
                a = GG(a, b, c, d, x[i + 5], 5, 0xD62F105D);
                d = GG(d, a, b, c, x[i + 10], 9, 0x02441453);
                c = GG(c, d, a, b, x[i + 15], 14, 0xD8A1E681);
                b = GG(b, c, d, a, x[i + 4], 20, 0xE7D3FBC8);
                a = GG(a, b, c, d, x[i + 9], 5, 0x21E1CDE6);
                d = GG(d, a, b, c, x[i + 14], 9, 0xC33707D6);
                c = GG(c, d, a, b, x[i + 3], 14, 0xF4D50D87);
                b = GG(b, c, d, a, x[i + 8], 20, 0x455A14ED);
                a = GG(a, b, c, d, x[i + 13], 5, 0xA9E3E905);
                d = GG(d, a, b, c, x[i + 2], 9, 0xFCEFA3F8);
                c = GG(c, d, a, b, x[i + 7], 14, 0x676F02D9);
                b = GG(b, c, d, a, x[i + 12], 20, 0x8D2A4C8A);

                a = HH(a, b, c, d, x[i + 5], 4, 0xFFFA3942);
                d = HH(d, a, b, c, x[i + 8], 11, 0x8771F681);
                c = HH(c, d, a, b, x[i + 11], 16, 0x6D9D6122);
                b = HH(b, c, d, a, x[i + 14], 23, 0xFDE5380C);
                a = HH(a, b, c, d, x[i + 1], 4, 0xA4BEEA44);
                d = HH(d, a, b, c, x[i + 4], 11, 0x4BDECFA9);
                c = HH(c, d, a, b, x[i + 7], 16, 0xF6BB4B60);
                b = HH(b, c, d, a, x[i + 10], 23, 0xBEBFBC70);
                a = HH(a, b, c, d, x[i + 13], 4, 0x289B7EC6);
                d = HH(d, a, b, c, x[i + 0], 11, 0xEAA127FA);
                c = HH(c, d, a, b, x[i + 3], 16, 0xD4EF3085);
                b = HH(b, c, d, a, x[i + 6], 23, 0x04881D05);
                a = HH(a, b, c, d, x[i + 9], 4, 0xD9D4D039);
                d = HH(d, a, b, c, x[i + 12], 11, 0xE6DB99E5);
                c = HH(c, d, a, b, x[i + 15], 16, 0x1FA27CF8);
                b = HH(b, c, d, a, x[i + 2], 23, 0xC4AC5665);

                a = II(a, b, c, d, x[i + 0], 6, 0xF4292244);
                d = II(d, a, b, c, x[i + 7], 10, 0x432AFF97);
                c = II(c, d, a, b, x[i + 14], 15, 0xAB9423A7);
                b = II(b, c, d, a, x[i + 5], 21, 0xFC93A039);
                a = II(a, b, c, d, x[i + 12], 6, 0x655B59C3);
                d = II(d, a, b, c, x[i + 3], 10, 0x8F0CCC92);
                c = II(c, d, a, b, x[i + 10], 15, 0xFFEFF47D);
                b = II(b, c, d, a, x[i + 1], 21, 0x85845DD1);
                a = II(a, b, c, d, x[i + 8], 6, 0x6FA87E4F);
                d = II(d, a, b, c, x[i + 15], 10, 0xFE2CE6E0);
                c = II(c, d, a, b, x[i + 6], 15, 0xA3014314);
                b = II(b, c, d, a, x[i + 13], 21, 0x4E0811A1);
                a = II(a, b, c, d, x[i + 4], 6, 0xF7537E82);
                d = II(d, a, b, c, x[i + 11], 10, 0xBD3AF235);
                c = II(c, d, a, b, x[i + 2], 15, 0x2AD7D2BB);
                b = II(b, c, d, a, x[i + 9], 21, 0xEB86D391);

                a = addUnsigned(a, AA);
                b = addUnsigned(b, BB);
                c = addUnsigned(c, CC);
                d = addUnsigned(d, DD);
            }

            return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
        }

        // 使用新的AI文本翻译API (Bearer Token鉴权)
        function generateBaiduSign(text, salt, appid, key) {
            // AI API不需要签名，使用Bearer Token
            return key;
        }

        // 测试翻译
        async function testTranslation() {
            const resultDiv = document.getElementById('translation-result');
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '正在测试...';

            try {
                const appid = document.getElementById('appid').value;
                const apikey = document.getElementById('apikey').value;
                const secret = document.getElementById('secret').value;
                const text = document.getElementById('text').value;
                const from = document.getElementById('from').value;
                const to = document.getElementById('to').value;

                const salt = Date.now().toString();
                const sign = generateBaiduSign(text, salt, appid, apikey);

                const params = new URLSearchParams({
                    q: text,
                    from: from,
                    to: to,
                    appid: appid,
                    salt: salt,
                    sign: sign
                });

                // 通过代理服务器调用百度AI翻译API避免CORS问题
                const proxyParams = {
                    text: text,
                    from: from,
                    to: to
                };

                const response = await fetch('http://localhost:8081/proxy-test-baidu', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(proxyParams)
                });

                const data = await response.json();

                if (data.success) {
                    // 代理服务器返回成功，显示翻译结果
                    const apiData = data.data;
                    if (apiData.error_code) {
                        resultDiv.className = 'result error';
                        resultDiv.innerHTML = `<strong>API错误:</strong><br>
                            错误码: ${apiData.error_code}<br>
                            错误信息: ${apiData.error_msg}<br>
                            <small>百度AI翻译API</small>`;
                    } else {
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `<strong>🎉 翻译成功:</strong><br>
                            <strong>原文:</strong> ${text}<br>
                            <strong>译文:</strong> ${apiData.trans_result[0].dst}<br>
                            <small>百度AI翻译API • ${apiData.from} → ${apiData.to}</small>`;
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>代理调用失败:</strong><br>
                        ${data.error || '未知错误'}<br>
                        <small>请确保代理服务器在运行 (http://localhost:8081)</small>`;
                }

            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>网络错误:</strong><br>${error.message}`;
            }
        }

        // 显示签名调试信息
        function showSignDebug() {
            const debugDiv = document.getElementById('sign-debug');
            debugDiv.className = 'result info';

            const appid = document.getElementById('appid').value;
            const apikey = document.getElementById('apikey').value;
            const secret = document.getElementById('secret').value;
            const text = document.getElementById('text').value;

            const salt = Date.now().toString();
            const sign1 = generateBaiduSign(text, salt, appid, apikey);
            const sign2 = generateBaiduSign(text, salt, appid, secret);

            debugDiv.innerHTML = `<strong>签名计算过程:</strong><br>
                <strong>使用API Key签名:</strong><br>
                字符串: ${appid}${text}${salt}${apikey}<br>
                MD5: ${sign1}<br><br>
                <strong>使用Secret签名:</strong><br>
                字符串: ${appid}${text}${salt}${secret}<br>
                MD5: ${sign2}`;
        }

        // 检查代理服务器状态
        async function checkProxyStatus() {
            const resultDiv = document.getElementById('proxy-result');
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '正在检查代理服务器...';

            try {
                const response = await fetch('http://localhost:8081/proxy-test-unsplash');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>✅ 代理服务器正常:</strong><br>
                        状态: 运行中<br>
                        端口: 8081<br>
                        API测试: 通过<br>
                        <small>代理服务器可以正常调用外部API</small>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ 代理服务器异常:</strong><br>
                        HTTP状态: ${response.status}<br>
                        <small>请检查代理服务器是否在运行</small>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ 代理服务器连接失败:</strong><br>
                    错误: ${error.message}<br>
                    <small>请确保代理服务器在 http://localhost:8081 运行</small>`;
            }
        }
    </script>
