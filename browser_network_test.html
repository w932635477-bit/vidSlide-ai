<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器网络连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2.5em;
            background: linear-gradient(45deg, #007AFF, #5856D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .status-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2em;
        }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-warning { background: #fff3cd; color: #856404; }
        .status-info { background: #d1ecf1; color: #0c5460; }
        .status-title {
            font-size: 1.2em;
            font-weight: 600;
            margin: 0;
        }
        .status-text {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        .test-results {
            margin-top: 15px;
        }
        .result-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }
        .result-success { background: #28a745; color: white; }
        .result-error { background: #dc3545; color: white; }
        .result-pending { background: #ffc107; color: white; }
        .result-name {
            flex: 1;
            font-weight: 500;
        }
        .result-time {
            color: #666;
            font-size: 0.9em;
        }
        .btn {
            background: linear-gradient(45deg, #007AFF, #5856D6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,122,255,0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-outline {
            background: transparent;
            color: #007AFF;
            border: 2px solid #007AFF;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #007AFF;
            color: white;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #007AFF, #5856D6);
            width: 0%;
            transition: width 0.3s ease;
        }
        .config-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #007AFF;
        }
        .config-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .config-item:last-child {
            border-bottom: none;
        }
        .config-label {
            font-weight: 500;
            color: #333;
        }
        .config-value {
            color: #007AFF;
            font-family: 'SF Mono', Monaco, monospace;
            font-weight: 500;
        }
        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">🌐 网络连接测试</div>
            <div class="subtitle">腾讯云科学上网代理状态检测</div>
        </div>

        <div class="status-card" id="proxy-status">
            <div class="status-header">
                <div class="status-icon status-info">🔍</div>
                <div>
                    <h3 class="status-title">代理服务状态</h3>
                    <p class="status-text">正在检查代理服务...</p>
                </div>
            </div>
            <div class="test-results" id="proxy-results" style="display: none;"></div>
        </div>

        <div class="status-card" id="connectivity-status">
            <div class="status-header">
                <div class="status-icon status-info">🌍</div>
                <div>
                    <h3 class="status-title">网络连通性测试</h3>
                    <p class="status-text">准备开始测试...</p>
                </div>
            </div>
            <div class="progress" id="test-progress" style="display: none;">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="test-results" id="connectivity-results" style="display: none;"></div>
        </div>

        <div class="config-info">
            <h4 style="margin-top: 0; color: #333;">📋 代理配置信息</h4>
            <div class="config-item">
                <span class="config-label">服务器地址</span>
                <span class="config-value">43.160.250.84</span>
            </div>
            <div class="config-item">
                <span class="config-label">HTTP代理端口</span>
                <span class="config-value">1081</span>
            </div>
            <div class="config-item">
                <span class="config-label">SOCKS5代理端口</span>
                <span class="config-value">1080</span>
            </div>
            <div class="config-item">
                <span class="config-label">协议类型</span>
                <span class="config-value">VMess + TCP</span>
            </div>
            <div class="config-item">
                <span class="config-label">服务提供商</span>
                <span class="config-value">腾讯云轻量服务器</span>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" onclick="checkProxyStatus()">🔄 检查代理状态</button>
            <button class="btn" onclick="testConnectivity()">🌐 测试连通性</button>
            <button class="btn" onclick="testAllSites()">🌍 测试国际网站</button>
            <button class="btn btn-outline" onclick="clearResults()">🧹 清除结果</button>
        </div>
    </div>

    <script>
        // 创建浮动粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        async function updateProgress(percent) {
            const progressBar = document.getElementById('progress-bar');
            const progress = document.getElementById('test-progress');
            progress.style.display = 'block';
            progressBar.style.width = percent + '%';
        }

        function showResults(elementId, results) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.innerHTML = results;
        }

        function updateStatus(cardId, iconClass, title, text, results = null) {
            const card = document.getElementById(cardId);
            const icon = card.querySelector('.status-icon');
            const titleEl = card.querySelector('.status-title');
            const textEl = card.querySelector('.status-text');

            icon.className = `status-icon ${iconClass}`;
            titleEl.textContent = title;
            textEl.textContent = text;

            if (results) {
                showResults(cardId.replace('status', 'results'), results);
            }
        }

        async function checkProxyStatus() {
            updateStatus('proxy-status', 'status-info', '代理服务状态', '正在检查代理服务...');

            try {
                const response = await fetch('https://httpbin.org/ip');
                const data = await response.json();
                const ip = data.origin;

                const results = `
                    <div class="result-item">
                        <div class="result-status result-success">✓</div>
                        <div class="result-name">代理连接</div>
                        <div class="result-time">IP: ${ip}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-status result-success">✓</div>
                        <div class="result-name">服务器响应</div>
                        <div class="result-time">腾讯云正常</div>
                    </div>
                `;

                updateStatus('proxy-status', 'status-success', '代理服务正常', `出口IP: ${ip}`, results);

            } catch (error) {
                const results = `
                    <div class="result-item">
                        <div class="result-status result-error">✗</div>
                        <div class="result-name">代理连接失败</div>
                        <div class="result-time">${error.message}</div>
                    </div>
                `;

                updateStatus('proxy-status', 'status-error', '代理服务异常', '无法连接到代理服务器', results);
            }
        }

        async function testConnectivity() {
            updateStatus('connectivity-status', 'status-info', '网络连通性测试', '正在测试网络连接...');
            updateProgress(0);

            const results = [];
            let successCount = 0;

            // 测试基本连通性
            try {
                const response = await fetch('https://httpbin.org/ip');
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-success">✓</div>
                        <div class="result-name">基础代理测试</div>
                        <div class="result-time">成功</div>
                    </div>
                `);
                successCount++;
            } catch (error) {
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-error">✗</div>
                        <div class="result-name">基础代理测试</div>
                        <div class="result-time">失败</div>
                    </div>
                `);
            }

            updateProgress(33);

            // 测试Google
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch('https://www.google.com', { 
                    method: 'HEAD', 
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-success">✓</div>
                        <div class="result-name">Google访问</div>
                        <div class="result-time">可访问</div>
                    </div>
                `);
                successCount++;
            } catch (error) {
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-error">✗</div>
                        <div class="result-name">Google访问</div>
                        <div class="result-time">无法访问</div>
                    </div>
                `);
            }

            updateProgress(66);

            // 测试GitHub
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch('https://github.com', { 
                    method: 'HEAD', 
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-success">✓</div>
                        <div class="result-name">GitHub访问</div>
                        <div class="result-time">可访问</div>
                    </div>
                `);
                successCount++;
            } catch (error) {
                results.push(`
                    <div class="result-item">
                        <div class="result-status result-error">✗</div>
                        <div class="result-name">GitHub访问</div>
                        <div class="result-time">无法访问</div>
                    </div>
                `);
            }

            updateProgress(100);

            const statusClass = successCount >= 2 ? 'status-success' : 'status-error';
            const statusTitle = successCount >= 2 ? '网络连通性正常' : '网络连通性异常';
            const statusText = `测试完成 - ${successCount}/3 项通过`;

            updateStatus('connectivity-status', statusClass, statusTitle, statusText, results.join(''));
        }

        async function testAllSites() {
            updateStatus('connectivity-status', 'status-info', '国际网站测试', '正在测试多个国际网站...');
            updateProgress(0);

            const sites = [
                { name: 'Google', url: 'https://www.google.com' },
                { name: 'GitHub', url: 'https://github.com' },
                { name: 'Twitter', url: 'https://twitter.com' },
                { name: 'YouTube', url: 'https://www.youtube.com' },
                { name: 'Wikipedia', url: 'https://www.wikipedia.org' },
                { name: 'Stack Overflow', url: 'https://stackoverflow.com' }
            ];

            const results = [];
            let successCount = 0;

            for (let i = 0; i < sites.length; i++) {
                const site = sites[i];
                updateProgress((i / sites.length) * 100);

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    
                    const response = await fetch(site.url, { 
                        method: 'HEAD', 
                        mode: 'no-cors',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    results.push(`
                        <div class="result-item">
                            <div class="result-status result-success">✓</div>
                            <div class="result-name">${site.name}</div>
                            <div class="result-time">可访问</div>
                        </div>
                    `);
                    successCount++;
                } catch (error) {
                    results.push(`
                        <div class="result-item">
                            <div class="result-status result-error">✗</div>
                            <div class="result-name">${site.name}</div>
                            <div class="result-time">无法访问</div>
                        </div>
                    `);
                }
            }

            updateProgress(100);

            const statusClass = successCount > sites.length / 2 ? 'status-success' : 'status-error';
            const statusTitle = successCount > sites.length / 2 ? '国际网站访问正常' : '国际网站访问异常';
            const statusText = `测试完成 - ${successCount}/${sites.length} 个网站可访问`;

            updateStatus('connectivity-status', statusClass, statusTitle, statusText, results.join(''));
        }

        function clearResults() {
            document.getElementById('proxy-results').style.display = 'none';
            document.getElementById('connectivity-results').style.display = 'none';
            document.getElementById('test-progress').style.display = 'none';
            document.getElementById('progress-bar').style.width = '0%';
            
            updateStatus('proxy-status', 'status-info', '代理服务状态', '点击按钮开始检查');
            updateStatus('connectivity-status', 'status-info', '网络连通性测试', '点击按钮开始测试');
        }

        // 初始化
        window.onload = function() {
            createParticles();
            setTimeout(checkProxyStatus, 1000);
        };
    </script>
</body>
</html>
