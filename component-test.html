<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件测试</title>
</head>
<body>
    <h1>组件导入测试</h1>
    <div id="test-results"></div>

    <script type="module">
        const results = document.getElementById('test-results');

        async function testComponentImports() {
            const components = [
                'TemplateSelector',
                'UserAdjustmentPanel',
                'PictureInPicture',
                'ExportDialog'
            ];

            for (const comp of components) {
                try {
                    const module = await import(`./vidslide-ai/src/components/${comp === 'TemplateSelector' ? 'templates/' : ''}${comp}.vue`);
                    results.innerHTML += `<div style="color: green;">✅ ${comp} 导入成功</div>`;
                } catch (error) {
                    results.innerHTML += `<div style="color: red;">❌ ${comp} 导入失败: ${error.message}</div>`;
                }
            }

            // 测试视图导入
            try {
                const workspaceModule = await import('./vidslide-ai/src/views/WorkspaceView.vue');
                results.innerHTML += `<div style="color: green;">✅ WorkspaceView 导入成功</div>`;
            } catch (error) {
                results.innerHTML += `<div style="color: red;">❌ WorkspaceView 导入失败: ${error.message}</div>`;
            }
        }

        testComponentImports();
    </script>
</body>
</html>
