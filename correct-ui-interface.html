<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidSlide AI - 苹果风格专业工作界面</title>
    <style>
        /* ===========================================
           VidSlide AI - 苹果风格专业UI界面
           基于V0.dev设计的专业工作空间
           =========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: #1A1A1A;
            color: #FFFFFF;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .title-bar {
            height: 40px;
            background: #2A2A2A;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            padding: 0 20px;
            -webkit-app-region: drag;
        }

        .title-bar h1 {
            font-size: 14px;
            font-weight: 500;
            color: #FFFFFF;
        }

        /* 主工作区 - 三栏布局 */
        .workspace {
            display: grid;
            grid-template-columns: 64px 1fr 320px;
            height: calc(100vh - 40px);
        }

        /* 左侧工具栏 */
        .toolbar {
            background: #2A2A2A;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .tool-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(0, 122, 255, 0.2);
        }

        .tool-btn.active {
            background: #007AFF;
        }

        /* 主编辑区 */
        .main-canvas {
            background: #1A1A1A;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 画布容器 */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #1A1A1A 25%, transparent 25%),
                        linear-gradient(-45deg, #1A1A1A 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1A1A1A 75%),
                        linear-gradient(-45deg, transparent 75%, #1A1A1A 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            position: relative;
        }

        .canvas-content {
            max-width: 1440px;
            width: 100%;
            aspect-ratio: 16/9;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 模板预览 */
        .template-preview {
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .template-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        /* 右侧属性面板 */
        .properties-panel {
            background: #2A2A2A;
            border-left: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #404040;
        }

        .panel-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: #CCCCCC;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .panel-tab.active {
            background: #007AFF;
            color: #FFFFFF;
        }

        .panel-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .property-group {
            margin-bottom: 24px;
        }

        .property-group h3 {
            font-size: 14px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 16px;
        }

        .property-item {
            margin-bottom: 16px;
        }

        .property-label {
            display: block;
            font-size: 12px;
            color: #CCCCCC;
            margin-bottom: 8px;
        }

        .property-input {
            width: 100%;
            padding: 8px 12px;
            background: #404040;
            border: 1px solid #606060;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 14px;
        }

        .property-input:focus {
            outline: none;
            border-color: #007AFF;
        }

        /* 时间线 */
        .timeline {
            height: 120px;
            background: #2A2A2A;
            border-top: 1px solid #404040;
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .timeline-track {
            flex: 1;
            height: 40px;
            background: #404040;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .timeline-progress {
            height: 100%;
            background: #007AFF;
            border-radius: 4px;
            width: 30%;
        }

        .timeline-marker {
            position: absolute;
            top: -6px;
            width: 12px;
            height: 52px;
            background: #FF6B35;
            border-radius: 2px;
            cursor: pointer;
        }

        /* 模板选择器 */
        .template-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .template-card {
            background: #404040;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .template-card:hover {
            background: #505050;
            border-color: #007AFF;
        }

        .template-card.selected {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.1);
        }

        .template-name {
            font-size: 16px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        .template-desc {
            font-size: 14px;
            color: #CCCCCC;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 64px 1fr 280px;
            }
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }

            .toolbar {
                flex-direction: row;
                height: auto;
                padding: 10px;
                overflow-x: auto;
            }

            .tool-group {
                flex-direction: row;
            }

            .properties-panel {
                height: 300px;
            }

            .timeline {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <div class="title-bar">
        <h1>🎬 VidSlide AI - 专业视频编辑工作台</h1>
    </div>

    <!-- 主工作区 -->
    <div class="workspace">
        <!-- 左侧工具栏 -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn" title="新建项目">📄</button>
                <button class="tool-btn" title="打开项目">📂</button>
                <button class="tool-btn" title="保存">💾</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn active" title="上传视频">🎥</button>
                <button class="tool-btn" title="剪辑">✂️</button>
                <button class="tool-btn" title="分割">🔀</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" title="模板选择">🎨</button>
                <button class="tool-btn" title="幻灯片管理">📊</button>
                <button class="tool-btn" title="样式设置">🎯</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" title="文字工具">📝</button>
                <button class="tool-btn" title="形状工具">⬜</button>
                <button class="tool-btn" title="颜色">🎨</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" title="AI生成">🤖</button>
                <button class="tool-btn" title="智能同步">⚡</button>
                <button class="tool-btn" title="一键优化">✨</button>
            </div>
        </div>

        <!-- 主编辑区 -->
        <div class="main-canvas">
            <!-- 画布容器 -->
            <div class="canvas-container">
                <div class="canvas-content">
                    <div class="template-preview">
                        <img src="assets/templates/pip-template.png"
                             alt="画中画模板预览"
                             class="template-image"
                             id="currentTemplate">
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <div class="properties-panel">
            <div class="panel-tabs">
                <button class="panel-tab active">🎨 模板</button>
                <button class="panel-tab">⚙️ 样式</button>
                <button class="panel-tab">🎬 动画</button>
                <button class="panel-tab">🤖 AI助手</button>
            </div>

            <div class="panel-content">
                <div class="property-group">
                    <h3>模板选择</h3>
                    <div class="template-selector" id="templateSelector">
                        <div class="template-card selected" data-template="pip">
                            <div class="template-name">画中画</div>
                            <div class="template-desc">视频与PPT并排显示</div>
                        </div>
                        <div class="template-card" data-template="info-card">
                            <div class="template-name">信息卡片</div>
                            <div class="template-desc">数据可视化展示</div>
                        </div>
                        <div class="template-card" data-template="keyword">
                            <div class="template-name">关键词高亮</div>
                            <div class="template-desc">重点内容突出显示</div>
                        </div>
                        <div class="template-card" data-template="document">
                            <div class="template-name">文档展示</div>
                            <div class="template-desc">文件内容3D展示</div>
                        </div>
                        <div class="template-card" data-template="title">
                            <div class="template-name">标题文字</div>
                            <div class="template-desc">醒目标题动画</div>
                        </div>
                    </div>
                </div>

                <div class="property-group">
                    <h3>画中画设置</h3>
                    <div class="property-item">
                        <label class="property-label">位置</label>
                        <select class="property-input" id="pipPosition">
                            <option value="top-left">左上角</option>
                            <option value="top-right" selected>右上角</option>
                            <option value="bottom-left">左下角</option>
                            <option value="bottom-right">右下角</option>
                        </select>
                    </div>

                    <div class="property-item">
                        <label class="property-label">大小</label>
                        <input type="range" class="property-input" id="pipSize" min="10" max="50" value="25">
                    </div>

                    <div class="property-item">
                        <label class="property-label">样式</label>
                        <select class="property-input" id="pipStyle">
                            <option value="simple">简洁</option>
                            <option value="professional" selected>专业</option>
                            <option value="dynamic">活跃</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 时间线 -->
        <div class="timeline">
            <div class="timeline-track">
                <div class="timeline-progress"></div>
                <div class="timeline-marker" style="left: 20%;"></div>
                <div class="timeline-marker" style="left: 45%;"></div>
                <div class="timeline-marker" style="left: 70%;"></div>
            </div>
        </div>
    </div>

    <script>
        // 模板切换功能
        const templateCards = document.querySelectorAll('.template-card');
        const currentTemplate = document.getElementById('currentTemplate');
        const templates = {
            'pip': 'assets/templates/pip-template.png',
            'info-card': 'assets/templates/info-card-template.png',
            'keyword': 'assets/templates/keyword-template.png',
            'document': 'assets/templates/document-template.png',
            'title': 'assets/templates/title-template.png'
        };

        templateCards.forEach(card => {
            card.addEventListener('click', () => {
                // 移除其他选中状态
                templateCards.forEach(c => c.classList.remove('selected'));
                // 添加当前选中状态
                card.classList.add('selected');

                // 切换模板图片
                const templateType = card.dataset.template;
                currentTemplate.src = templates[templateType];
            });
        });

        // 初始化界面
        console.log('🎬 VidSlide AI 专业工作界面已加载');
        console.log('✅ 基于V0.dev苹果风格设计');
        console.log('✅ 三栏专业布局');
        console.log('✅ 模板预览系统');
        console.log('✅ 属性面板控制');
    </script>
</body>
</html>
