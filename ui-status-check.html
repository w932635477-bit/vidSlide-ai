<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI状态检查</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            margin: 0;
        }
        .status-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .status-section h3 {
            margin-top: 0;
            color: #007aff;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            font-weight: 500;
        }
        .status-value {
            font-family: monospace;
            font-size: 14px;
        }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
        .status-warning { color: #ffc107; }
        .status-info { color: #007bff; }
        .test-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background 0.2s;
        }
        .test-btn:hover { background: #0056cc; }
        .test-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .result.success { background: #d4edda; color: #155724; }
        .result.error { background: #f8d7da; color: #721c24; }
        .result.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="status-container">
        <h1>🔍 VidSlide AI UI状态检查</h1>
        <p>检查当前页面的UI组件状态和功能</p>

        <!-- 页面信息 -->
        <div class="status-section">
            <h3>📄 页面信息</h3>
            <div class="status-item">
                <span class="status-label">当前URL:</span>
                <span class="status-value" id="current-url">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">页面标题:</span>
                <span class="status-value" id="page-title">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Vue实例:</span>
                <span class="status-value" id="vue-status">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">路由状态:</span>
                <span class="status-value" id="route-status">检查中...</span>
            </div>
        </div>

        <!-- 组件检查 -->
        <div class="status-section">
            <h3>🧩 组件检查</h3>
            <div class="status-item">
                <span class="status-label">视频上传区域:</span>
                <span class="status-value" id="upload-area">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">左侧导航栏:</span>
                <span class="status-value" id="left-panel">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">模板选择器:</span>
                <span class="status-value" id="template-selector">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">画布区域:</span>
                <span class="status-value" id="canvas-area">检查中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">导出按钮:</span>
                <span class="status-value" id="export-buttons">检查中...</span>
            </div>
        </div>

        <!-- 功能测试 -->
        <div class="status-section">
            <h3>⚙️ 功能测试</h3>
            <button class="test-btn" onclick="checkPageStatus()">检查页面状态</button>
            <button class="test-btn" onclick="checkComponents()">检查组件存在</button>
            <button class="test-btn" onclick="testFileUpload()">测试文件上传</button>
            <button class="test-btn" onclick="testNavigation()">测试导航</button>
            <button class="test-btn" onclick="openEditorPage()">跳转到编辑器</button>

            <div id="test-result" class="result info" style="display: none;"></div>
        </div>

        <!-- 调试信息 -->
        <div class="status-section">
            <h3>🐛 调试信息</h3>
            <button class="test-btn" onclick="showConsoleErrors()">显示控制台错误</button>
            <button class="test-btn" onclick="clearDebugInfo()">清除调试信息</button>

            <div id="debug-info" class="result info" style="display: none;"></div>
        </div>
    </div>

    <script>
        let consoleErrors = [];
        let originalConsoleError = console.error;

        // 捕获控制台错误
        console.error = function(...args) {
            consoleErrors.push({
                timestamp: new Date().toLocaleTimeString(),
                message: args.join(' ')
            });
            originalConsoleError.apply(console, args);
        };

        // 页面加载完成后的检查
        window.addEventListener('load', function() {
            updatePageInfo();
            checkComponents();
        });

        function updatePageInfo() {
            document.getElementById('current-url').textContent = window.location.href;
            document.getElementById('page-title').textContent = document.title;

            // 检查Vue实例
            let vueStatus = '未找到';
            if (window.Vue) {
                vueStatus = 'Vue.js已加载';
            }
            // 检查是否有Vue应用实例
            const appElement = document.getElementById('app');
            if (appElement && appElement.__vue__) {
                vueStatus = 'Vue应用已挂载';
            }
            document.getElementById('vue-status').textContent = vueStatus;

            // 检查路由
            let routeStatus = '未知';
            try {
                if (window.location.pathname === '/') {
                    routeStatus = '主页 (/)';
                } else if (window.location.pathname === '/editor') {
                    routeStatus = '编辑器 (/editor)';
                } else {
                    routeStatus = window.location.pathname;
                }
            } catch (e) {
                routeStatus = '检查失败';
            }
            document.getElementById('route-status').textContent = routeStatus;
        }

        function checkComponents() {
            // 检查视频上传区域
            const uploadArea = document.querySelector('.upload-section, .file-input, [type="file"]');
            document.getElementById('upload-area').textContent = uploadArea ? '✅ 存在' : '❌ 未找到';

            // 检查左侧导航栏
            const leftPanel = document.querySelector('.left-panel, aside');
            document.getElementById('left-panel').textContent = leftPanel ? '✅ 存在' : '❌ 未找到';

            // 检查模板选择器
            const templateSelector = document.querySelector('[class*="template"], .template-selector');
            document.getElementById('template-selector').textContent = templateSelector ? '✅ 存在' : '❌ 未找到';

            // 检查画布区域
            const canvasArea = document.querySelector('canvas, .canvas-container');
            document.getElementById('canvas-area').textContent = canvasArea ? '✅ 存在' : '❌ 未找到';

            // 检查导出按钮
            const exportButtons = document.querySelectorAll('[class*="export"], [class*="preview"], [class*="reset"]');
            document.getElementById('export-buttons').textContent = exportButtons.length > 0 ? `✅ 找到 ${exportButtons.length} 个` : '❌ 未找到';
        }

        function checkPageStatus() {
            const result = document.getElementById('test-result');
            result.style.display = 'block';
            result.className = 'result info';

            let status = '页面状态检查结果:\\n\\n';
            status += `URL: ${window.location.href}\\n`;
            status += `标题: ${document.title}\\n`;
            status += `Vue加载: ${window.Vue ? '是' : '否'}\\n`;

            const uploadArea = document.querySelector('.upload-section, .file-input, [type="file"]');
            status += `上传区域: ${uploadArea ? '存在' : '不存在'}\\n`;

            const leftPanel = document.querySelector('.left-panel, aside');
            status += `左侧面板: ${leftPanel ? '存在' : '不存在'}\\n`;

            const canvas = document.querySelector('canvas');
            status += `画布: ${canvas ? '存在' : '不存在'}\\n`;

            result.textContent = status;
        }

        function testFileUpload() {
            const result = document.getElementById('test-result');
            result.style.display = 'block';

            const fileInput = document.querySelector('input[type="file"]');
            if (!fileInput) {
                result.className = 'result error';
                result.textContent = '❌ 未找到文件输入元素';
                return;
            }

            result.className = 'result success';
            result.textContent = `✅ 文件输入元素找到\\n类型: ${fileInput.type}\\n接受类型: ${fileInput.accept}\\n事件绑定: ${fileInput.hasAttribute('@change') || fileInput.onchange ? '有' : '无'}`;

            // 尝试触发文件选择
            try {
                fileInput.click();
            } catch (e) {
                result.textContent += `\\n⚠️ 无法自动触发文件选择: ${e.message}`;
            }
        }

        function testNavigation() {
            const result = document.getElementById('test-result');
            result.style.display = 'block';

            const leftPanel = document.querySelector('.left-panel, aside');
            if (!leftPanel) {
                result.className = 'result error';
                result.textContent = '❌ 未找到左侧导航栏';
                return;
            }

            const buttons = leftPanel.querySelectorAll('button, [role="button"], .template-card, [tabindex]');
            result.className = 'result success';
            result.textContent = `✅ 左侧面板找到\\n可点击元素: ${buttons.length} 个\\n`;

            // 检查具体组件
            const templateCards = leftPanel.querySelectorAll('.template-card');
            const adjustmentPanel = leftPanel.querySelectorAll('[class*="adjustment"], [class*="setting"]');

            result.textContent += `模板卡片: ${templateCards.length} 个\\n`;
            result.textContent += `调整面板: ${adjustmentPanel.length} 个`;
        }

        function openEditorPage() {
            const result = document.getElementById('test-result');
            result.style.display = 'block';
            result.className = 'result info';
            result.textContent = '正在跳转到编辑器页面...';

            // 检查是否已经在编辑器页面
            if (window.location.pathname === '/editor') {
                result.className = 'result success';
                result.textContent = '✅ 已经在编辑器页面';
                return;
            }

            // 尝试跳转
            try {
                window.location.href = '/editor';
            } catch (e) {
                result.className = 'result error';
                result.textContent = `❌ 跳转失败: ${e.message}`;
            }
        }

        function showConsoleErrors() {
            const debugInfo = document.getElementById('debug-info');
            debugInfo.style.display = 'block';

            if (consoleErrors.length === 0) {
                debugInfo.className = 'result success';
                debugInfo.textContent = '✅ 没有捕获到控制台错误';
                return;
            }

            debugInfo.className = 'result error';
            let errorText = `捕获到 ${consoleErrors.length} 个错误:\\n\\n`;

            consoleErrors.forEach((error, index) => {
                errorText += `[${index + 1}] ${error.timestamp}: ${error.message}\\n`;
            });

            debugInfo.textContent = errorText;
        }

        function clearDebugInfo() {
            consoleErrors = [];
            document.getElementById('debug-info').style.display = 'none';
            document.getElementById('test-result').style.display = 'none';
        }

        // 自动初始化
        setTimeout(() => {
            updatePageInfo();
            checkComponents();
        }, 1000);
    </script>
</body>
</html>
