<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终验证</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            min-height: 100vh;
            color: white;
        }
        .verification-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            color: #333;
        }
        .verification-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .verification-header h1 {
            color: #007aff;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .verification-header p {
            color: #666;
            font-size: 1.1em;
        }
        .test-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
        }
        .test-result.success {
            background: #d4edda;
            border-color: #28a745;
        }
        .test-result.error {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .test-result.pending {
            background: #fff3cd;
            border-color: #ffc107;
        }
        .test-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        .test-status {
            font-weight: 500;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .status-success { background: #28a745; color: white; }
        .status-error { background: #dc3545; color: white; }
        .status-pending { background: #ffc107; color: #212529; }
        .summary {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin-top: 40px;
            text-align: center;
        }
        .summary h2 {
            color: #007aff;
            margin-bottom: 20px;
        }
        .metric {
            display: inline-block;
            margin: 10px 20px;
            text-align: center;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #007aff;
        }
        .metric-label {
            color: #666;
            font-size: 0.9em;
        }
        .action-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 20px 10px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #0056cc; }
        .action-btn.success { background: #28a745; }
        .action-btn.success:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-header">
            <h1>🎉 最终验证</h1>
            <p>VidSlide AI Process错误修复验证</p>
        </div>

        <div id="test-results">
            <!-- 测试结果将在这里动态插入 -->
        </div>

        <div class="summary" id="summary" style="display: none;">
            <h2>验证结果汇总</h2>
            <div class="metric">
                <div class="metric-value" id="total-tests">0</div>
                <div class="metric-label">总测试数</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="passed-tests">0</div>
                <div class="metric-label">通过</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="failed-tests">0</div>
                <div class="metric-label">失败</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="pass-rate">0%</div>
                <div class="metric-label">通过率</div>
            </div>

            <div id="final-message" style="margin-top: 30px; padding: 20px; border-radius: 8px;"></div>

            <a href="http://localhost:5173/" class="action-btn success" id="goto-app" style="display: none;">
                🚀 进入VidSlide AI应用
            </a>
        </div>
    </div>

    <script>
        const tests = [
            { id: 'app-load', name: '应用启动', description: '检查Vite应用是否正常启动' },
            { id: 'router-init', name: '路由初始化', description: '检查Vue Router是否正常初始化' },
            { id: 'api-config', name: 'API配置加载', description: '检查API配置文件是否正常加载' },
            { id: 'process-fix', name: 'Process错误修复', description: '验证process.env访问修复是否有效' },
            { id: 'page-navigation', name: '页面导航', description: '检查页面间导航是否正常' }
        ];

        let testResults = [];
        let currentTestIndex = 0;

        function createTestElement(test) {
            return `
                <div class="test-result pending" id="test-${test.id}">
                    <div>
                        <div class="test-name">${test.name}</div>
                        <div style="color: #666; font-size: 0.9em;">${test.description}</div>
                    </div>
                    <div class="test-status status-pending">等待测试</div>
                </div>
            `;
        }

        function updateTestResult(testId, status, message = '') {
            const testElement = document.getElementById(`test-${testId}`);
            const statusElement = testElement.querySelector('.test-status');

            testElement.className = `test-result ${status}`;
            statusElement.className = `test-status status-${status}`;
            statusElement.textContent = message || (status === 'success' ? '✅ 通过' : status === 'error' ? '❌ 失败' : '⏳ 进行中');

            testResults.push({ id: testId, status, message });
        }

        async function runTests() {
            // 初始化测试界面
            const resultsContainer = document.getElementById('test-results');
            resultsContainer.innerHTML = tests.map(test => createTestElement(test)).join('');

            // 测试1: 应用启动
            updateTestResult('app-load', 'pending', '检查中...');
            try {
                const response = await fetch('http://localhost:5173/');
                if (response.ok) {
                    updateTestResult('app-load', 'success');
                } else {
                    updateTestResult('app-load', 'error', `HTTP ${response.status}`);
                }
            } catch (error) {
                updateTestResult('app-load', 'error', error.message);
            }

            // 测试2: 路由初始化
            updateTestResult('router-init', 'pending', '检查中...');
            try {
                // 等待一段时间让应用完全加载
                await new Promise(resolve => setTimeout(resolve, 2000));

                // 检查是否有Vue Router相关的错误
                const hasRouterError = window.console.errors &&
                    window.console.errors.some(error =>
                        error.includes('process is not defined') ||
                        error.includes('router')
                    );

                if (!hasRouterError) {
                    updateTestResult('router-init', 'success');
                } else {
                    updateTestResult('router-init', 'error', '发现路由错误');
                }
            } catch (error) {
                updateTestResult('router-init', 'error', error.message);
            }

            // 测试3: API配置加载
            updateTestResult('api-config', 'pending', '检查中...');
            try {
                const { GOOGLE_SEARCH_CONFIG } = await import('./vidslide-ai/src/config/api-keys.js');
                if (GOOGLE_SEARCH_CONFIG && typeof GOOGLE_SEARCH_CONFIG === 'object') {
                    updateTestResult('api-config', 'success');
                } else {
                    updateTestResult('api-config', 'error', '配置对象无效');
                }
            } catch (error) {
                updateTestResult('api-config', 'error', error.message);
            }

            // 测试4: Process错误修复
            updateTestResult('process-fix', 'pending', '检查中...');
            try {
                // 测试process访问是否安全
                const safeAccess = (typeof process !== 'undefined' && process.env)
                    ? process.env.GOOGLE_SEARCH_API_KEY
                    : 'safe';

                if (safeAccess !== undefined) {
                    updateTestResult('process-fix', 'success');
                } else {
                    updateTestResult('process-fix', 'error', '访问失败');
                }
            } catch (error) {
                updateTestResult('process-fix', 'error', error.message);
            }

            // 测试5: 页面导航
            updateTestResult('page-navigation', 'pending', '检查中...');
            try {
                const response = await fetch('http://localhost:5173/editor');
                if (response.ok) {
                    updateTestResult('page-navigation', 'success');
                } else {
                    updateTestResult('page-navigation', 'error', `HTTP ${response.status}`);
                }
            } catch (error) {
                updateTestResult('page-navigation', 'error', error.message);
            }

            // 显示汇总结果
            showSummary();
        }

        function showSummary() {
            const summaryDiv = document.getElementById('summary');
            const totalTests = testResults.length;
            const passedTests = testResults.filter(t => t.status === 'success').length;
            const failedTests = testResults.filter(t => t.status === 'error').length;
            const passRate = Math.round((passedTests / totalTests) * 100);

            document.getElementById('total-tests').textContent = totalTests;
            document.getElementById('passed-tests').textContent = passedTests;
            document.getElementById('failed-tests').textContent = failedTests;
            document.getElementById('pass-rate').textContent = `${passRate}%`;

            const finalMessageDiv = document.getElementById('final-message');
            const gotoAppBtn = document.getElementById('goto-app');

            if (failedTests === 0) {
                finalMessageDiv.innerHTML = `
                    <div style="background: #d4edda; color: #155724; padding: 20px; border-radius: 8px; border: 1px solid #c3e6cb;">
                        <h3 style="margin: 0 0 10px 0;">🎉 所有测试通过！</h3>
                        <p style="margin: 0;">VidSlide AI应用已完全修复并可以正常使用。</p>
                    </div>
                `;
                gotoAppBtn.style.display = 'inline-block';
            } else {
                finalMessageDiv.innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 8px; border: 1px solid #f5c6cb;">
                        <h3 style="margin: 0 0 10px 0;">⚠️ 发现问题</h3>
                        <p style="margin: 0;">有 ${failedTests} 项测试失败，请检查并修复相关问题。</p>
                    </div>
                `;
            }

            summaryDiv.style.display = 'block';
        }

        // 启动测试
        window.addEventListener('load', function() {
            setTimeout(runTests, 1000);
        });
    </script>
</body>
</html>
